openapi: 3.1.0
info: {title: Factory Finder notifications, version: 0.1.0, description: "Watchlist, rule-based alerts (price_drop, below_target, cheaper_equivalent, back_in_stock, new_results), alerts inbox and device push tokens. User routes need X-User-Id (401 otherwise); other users' resources give 403. POST /v1/alerts/evaluate is internal (X-Internal-Token when FF_INTERNAL_TOKEN is set)."}
servers: [{url: http://localhost:8108}]
paths:
  /health:
    get: {operationId: health, responses: {"200": {description: ok}}}
  /ready:
    get:
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: notifications}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: notifications}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/watchlist:
    get:
      operationId: listWatchlist
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200": {description: Caller's watches, content: {application/json: {schema: {type: object, required: [items, total], properties: {items: {type: array, items: {$ref: "#/components/schemas/Watch"}}, total: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      operationId: addWatch
      description: Exactly one of listing_id or search. Idempotent per owner and target (200 returns the existing watch, 201 a new one).
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WatchCreate"}}}}
      responses:
        "200": {description: Existing watch, content: {application/json: {schema: {$ref: "#/components/schemas/Watch"}}}}
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Watch"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/watchlist/{id}:
    delete:
      operationId: deleteWatch
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/alerts:
    get:
      operationId: listAlerts
      parameters:
        - {name: unread_only, in: query, schema: {type: boolean, default: false}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Inbox, newest first, content: {application/json: {schema: {$ref: "#/components/schemas/AlertPage"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/alerts/evaluate:
    post:
      operationId: evaluateAlerts
      description: Internal. Evaluates active watches against sourcing, applies cooldown/dedupe, stores alerts and sends push summaries.
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {owner_id: {type: [string, "null"]}, watch_id: {type: [string, "null"]}}}}}}
      responses:
        "200": {description: Run report, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationReport"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/internal/tracking-events:
    post:
      operationId: ingestTrackingEvents
      description: |
        Internal (X-Internal-Token when FF_INTERNAL_TOKEN is set). Consumer side of tracking's outbox: each event is one `tracking_outbox` row.
        Creates one inbox alert per event (rule `shipment_status` for kind `status_changed`, `shipment_delayed` for `shipment_delayed`), idempotent by
        `dedupe_key` (replays and duplicates inside a batch give `duplicate`, no second alert or push). Push honors the owner's channel prefs / quiet
        hours for the rule; the inbox is always written. Invalid events are reported per item (`invalid`) and never fail the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [dedupe_key, shipment_id, owner_id, kind, payload]
                    properties:
                      id: {type: integer, description: "outbox row id (informational)"}
                      dedupe_key: {type: string, maxLength: 300}
                      shipment_id: {type: string, maxLength: 128}
                      owner_id: {type: string, maxLength: 64}
                      kind: {type: string, enum: [status_changed, shipment_delayed]}
                      payload: {type: object, description: "shipment_id, owner_id, reference, reference_type, label, kind, status, previous_status, eta, delayed, delay_hours, event_id, occurred_at"}
      responses:
        "200":
          description: Per-event outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: {type: integer}
                  created: {type: integer}
                  duplicates: {type: integer}
                  invalid: {type: integer}
                  pushes_sent: {type: integer}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: {type: integer}
                        dedupe_key: {type: [string, "null"]}
                        status: {type: string, enum: [created, duplicate, invalid]}
                        alert_id: {type: string}
                        error: {type: string}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/alerts/read-all:
    post:
      operationId: markAllAlertsRead
      responses:
        "200": {description: Count marked, content: {application/json: {schema: {type: object, properties: {marked: {type: integer}}}}}}
  /v1/alerts/{id}/read:
    post:
      operationId: markAlertRead
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Alert, content: {application/json: {schema: {$ref: "#/components/schemas/Alert"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/devices:
    get:
      operationId: listDevices
      responses:
        "200": {description: Caller's devices, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Device"}}}}}}}
    post:
      operationId: registerDevice
      description: Upsert by token (a token moves to the latest registering user). At most 10 active devices per user (422 device_limit).
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceCreate"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Device"}}}}
        "201": {description: Registered, content: {application/json: {schema: {$ref: "#/components/schemas/Device"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/notification-prefs:
    get:
      operationId: getNotificationPrefs
      description: Caller's delivery preferences (defaults when never saved).
      responses:
        "200": {description: Preferences, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPrefs"}}}}
    put:
      operationId: putNotificationPrefs
      description: Partial update. Channels per alert type (in_app, push, email), quiet hours in the user's timezone (push is deferred, not dropped), language ar/en. Enforced at delivery time. in_app is accepted but the inbox is never suppressed.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPrefsUpdate"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPrefs"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/notification-prefs/verify-email:
    post:
      operationId: verifyDigestEmail
      description: Promotes the pending digest address to verified when the code matches (15 min expiry; 5 wrong tries lock verification for 1 hour).
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/VerifyEmail"}}}}
      responses:
        "200": {description: Verified (digest_email set, digest_email_verified true), content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPrefs"}}}}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/notification-prefs/resend-code:
    post:
      operationId: resendDigestEmailCode
      description: Mails a fresh code to the pending address (max 3 sends/hour/user, shared with address changes). Invalidates the previous code.
      responses:
        "200": {description: Sent, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPrefs"}}}}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/alerts/digest:
    post:
      operationId: sendDigests
      description: Internal (X-Internal-Token). Enqueues and sends the daily email digest (idempotent per user per local day).
      responses:
        "200": {description: Sent, content: {application/json: {schema: {type: object, properties: {sent: {type: integer}}}}}}
  /v1/devices/{id}:
    delete:
      operationId: deleteDevice
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: notifications}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: notifications}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller}
components:
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties: {amount: {type: string, description: decimal string}, currency: {type: string}}
    SearchQuery:
      type: object
      properties: {q: {type: string}, kind: {type: string}, condition: {type: string}, origin_country: {type: string}, category: {type: string}, min_price: {type: string}, max_price: {type: string}, moq_max: {type: integer}, verified_only: {type: boolean}}
    WatchCreate:
      type: object
      properties:
        listing_id: {type: string}
        search: {$ref: "#/components/schemas/SearchQuery"}
        target_price: {$ref: "#/components/schemas/Money"}
        drop_threshold_pct: {type: string, description: "percent, default 5"}
    Watch:
      type: object
      required: [id, type, drop_threshold_pct, active]
      properties:
        id: {type: string}
        type: {type: string, enum: [listing, search]}
        listing_id: {type: [string, "null"]}
        search: {oneOf: [{$ref: "#/components/schemas/SearchQuery"}, {type: "null"}]}
        target_price: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        drop_threshold_pct: {type: string}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        title: {type: [string, "null"]}
        title_ar: {type: [string, "null"]}
        baseline_price: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        current_price: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        available: {type: [boolean, "null"]}
        result_count: {type: [integer, "null"]}
        last_checked_at: {type: [string, "null"], format: date-time}
    Alert:
      type: object
      required: [id, watch_id, rule, title, title_ar, body, body_ar, read]
      properties:
        id: {type: string}
        watch_id: {type: string}
        rule: {type: string, enum: [price_drop, below_target, cheaper_equivalent, back_in_stock, new_results, shipment_status, shipment_delayed]}
        title: {type: string}
        title_ar: {type: string}
        body: {type: string}
        body_ar: {type: string}
        payload: {type: object, description: "listing_ids, old_price, new_price, drop_pct, target_price, result_count; shipment alerts add `shipment` {shipment_id, kind, reference, reference_type, label, status, previous_status, eta, delayed, delay_hours} and have watch_id `shp_<hash>`"}
        read: {type: boolean}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, "null"], format: date-time}
    AlertPage:
      type: object
      required: [items, total, page, page_size, unread_total]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Alert"}}, total: {type: integer}, page: {type: integer}, page_size: {type: integer}, unread_total: {type: integer}}
    EvaluationReport:
      type: object
      properties:
        evaluated: {type: integer}
        alerts_created: {type: integer}
        pushes_sent: {type: integer}
        skipped: {type: array, items: {type: object, properties: {watch_id: {type: string}, rule: {type: string}, reason: {type: string, enum: [duplicate, cooldown]}}}}
        errors: {type: array, items: {type: object}}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}
    DeviceCreate:
      type: object
      required: [platform, token]
      properties: {platform: {type: string, enum: [android, ios]}, token: {type: string}, locale: {type: string, enum: [ar, en], default: ar}}
    Device:
      type: object
      properties: {id: {type: string}, platform: {type: string}, locale: {type: string}, token: {type: string}, created_at: {type: string, format: date-time}, active: {type: boolean, description: False once the provider reported the token invalid; registering the token again reactivates it}}
    NotificationPrefs:
      type: object
      properties:
        channels: {type: object, additionalProperties: {type: array, items: {type: string, enum: [in_app, push, email]}}}
        quiet_hours: {type: [object, "null"], properties: {start: {type: string, example: "22:00"}, end: {type: string, example: "07:00"}}}
        timezone: {type: string, example: Asia/Baghdad}
        language: {type: [string, "null"], enum: [ar, en, null]}
        email: {type: [string, "null"], deprecated: true, description: "Deprecated alias of digest_email (the VERIFIED address only)."}
        digest_email: {type: [string, "null"], description: "VERIFIED digest address; the only one the digest is ever sent to."}
        digest_email_verified: {type: boolean}
        digest_email_pending: {type: [string, "null"], description: "Masked (a***@e***.com) address awaiting its 6-digit code. The code is never returned."}
    NotificationPrefsUpdate:
      type: object
      properties:
        channels: {type: object, additionalProperties: {type: array, items: {type: string, enum: [in_app, push, email]}}}
        quiet_hours: {type: object, required: [start, end], properties: {start: {type: string}, end: {type: string}}}
        clear_quiet_hours: {type: boolean}
        timezone: {type: string}
        language: {type: string, enum: [ar, en]}
        email: {type: string, deprecated: true, description: "Deprecated alias of digest_email."}
        digest_email: {type: string, maxLength: 254, description: "Set/change => becomes digest_email_pending, verification reset, a 6-digit code is mailed (max 3 sends/hour/user; 429 send_limit). Empty string clears. No-op if equal to the verified or pending address."}
    VerifyEmail:
      type: object
      required: [code]
      properties: {code: {type: string, pattern: "^[0-9]{6}$"}}
