openapi: 3.1.0
info: {title: Factory Finder trust, version: 0.2.0, description: "Explainable supplier trust score 0-100. Bands: green>=75, yellow 50-74, red<50, unknown when fewer than 4 signals known (sanctions hit always red, score<=20)."}
servers: [{url: http://localhost:8104}]
paths:
  /health:
    get: {operationId: health, responses: {"200": {description: ok}}}
  /ready:
    get:
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: trust}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: trust}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/trust/suppliers/{supplier_id}:
    get:
      operationId: getSupplierTrust
      parameters: [{name: supplier_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Trust score, content: {application/json: {schema: {$ref: "#/components/schemas/TrustScoreV2"}}}}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/trust/suppliers:batch:
    get:
      operationId: batchSupplierTrust
      parameters: [{name: ids, in: query, required: true, description: "comma separated, max 50", schema: {type: string}}]
      responses:
        "200":
          description: Scores for known ids
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/TrustScoreV2"}}}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/trust/evaluate:
    post:
      operationId: evaluateTrust
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SupplierSignals"}}}}
      responses:
        "200": {description: Trust score, content: {application/json: {schema: {$ref: "#/components/schemas/TrustScoreV2"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/trust/suppliers/{supplier_id}/history:
    get:
      operationId: getSupplierTrustHistory
      summary: Score over time (oldest first), from stored snapshots plus deterministic mock history
      parameters: [{name: supplier_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: History, content: {application/json: {schema: {$ref: "#/components/schemas/TrustHistory"}}}}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/trust/suppliers/{supplier_id}/report:
    post:
      operationId: reportSupplier
      summary: Buyer-submitted concern. Stored as pending_review; affects the score only after moderator acceptance.
      parameters:
        - {name: supplier_id, in: path, required: true, schema: {type: string}}
        - {name: X-User-Id, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SupplierReportIn"}}}}
      responses:
        "201": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/SupplierReport"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {description: Rate limited (default 5 reports/user/hour; Retry-After header), content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}}
  /v1/trust/suppliers/{supplier_id}/verification:
    get:
      operationId: getSupplierVerification
      summary: Public verified-business badge (level and valid document types only; no numbers, files or dates)
      parameters: [{name: supplier_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Badge, content: {application/json: {schema: {$ref: "#/components/schemas/PublicVerification"}}}}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/trust/verification/documents:
    post:
      operationId: submitVerificationDocument
      summary: Supplier submits verification document metadata (files are media-service uploads). Needs the gateway-verified X-Supplier-Id.
      parameters: [{name: X-Supplier-Id, in: header, required: true, schema: {type: string, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/VerificationDocumentIn"}}}}
      responses:
        "201": {description: Stored as pending, content: {application/json: {schema: {$ref: "#/components/schemas/VerificationDocument"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "409": {description: Duplicate document or per-type / per-supplier cap, content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}}
        "422": {$ref: "#/components/responses/Error"}
        "429": {description: Rate limited (default 10/supplier/hour; Retry-After), content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}}
    get:
      operationId: listMyVerificationDocuments
      summary: Own documents (masked number suffix only) and the current badge level
      parameters: [{name: X-Supplier-Id, in: header, required: true, schema: {type: string, maxLength: 128}}]
      responses:
        "200": {description: Documents, content: {application/json: {schema: {$ref: "#/components/schemas/VerificationDocumentList"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/trust/verification/documents/{document_id}:
    delete:
      operationId: withdrawVerificationDocument
      summary: Withdraw an own pending/approved document (other suppliers' ids answer 404)
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
        - {name: X-Supplier-Id, in: header, required: true, schema: {type: string, maxLength: 128}}
      responses:
        "200": {description: Withdrawn, content: {application/json: {schema: {$ref: "#/components/schemas/VerificationDocument"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/admin/trust/verification/documents:
    get:
      operationId: adminListVerificationDocuments
      summary: Review queue (default status=pending). 404 when FF_TRUST_ADMIN_TOKEN is unset, 401 on a wrong X-Admin-Token.
      parameters:
        - {name: X-Admin-Token, in: header, required: true, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, withdrawn, all], default: pending}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/AdminVerificationDocumentPage"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/trust/verification/documents/{document_id}/decision:
    post:
      operationId: adminDecideVerificationDocument
      summary: Approve or reject (reason required to reject; rejecting an approved document revokes it). Audited.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
        - {name: X-Admin-Token, in: header, required: true, schema: {type: string}}
        - {name: X-Reviewer, in: header, required: false, schema: {type: string, maxLength: 64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/VerificationDecisionIn"}}}}
      responses:
        "200": {description: Decided, content: {application/json: {schema: {$ref: "#/components/schemas/AdminVerificationDocument"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/admin/trust/verification/documents/{document_id}/expiry:
    put:
      operationId: adminSetVerificationExpiry
      summary: Set or clear the expiry of a pending/approved document. Audited.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
        - {name: X-Admin-Token, in: header, required: true, schema: {type: string}}
        - {name: X-Reviewer, in: header, required: false, schema: {type: string, maxLength: 64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/VerificationExpiryIn"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/AdminVerificationDocument"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/admin/trust/verification/audit:
    get:
      operationId: adminVerificationAudit
      summary: Append-only reviewer/supplier action log, newest first
      parameters:
        - {name: X-Admin-Token, in: header, required: true, schema: {type: string}}
        - {name: document_id, in: query, schema: {type: string}}
        - {name: supplier_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200": {description: Entries, content: {application/json: {schema: {$ref: "#/components/schemas/VerificationAudit"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}}
  schemas:
    TrustScoreV2:
      description: TrustScore plus v2 fields (all additive/optional for consumers).
      allOf:
        - $ref: "../schemas/common.schema.json#/$defs/TrustScore"
        - type: object
          properties:
            confidence: {type: integer, minimum: 0, maximum: 100, description: "How much evidence backs the score (coverage x sample depth)"}
            model_version: {type: string}
            data_gaps:
              type: array
              description: Missing signals, most influential first. Missing data lowers confidence, never the score.
              items: {type: object, required: [key, label, label_ar], properties: {key: {type: string}, label: {type: string}, label_ar: {type: string}}}
            verification_level: {type: string, enum: [none, basic, documented, audited], default: none, description: "Verified-business badge from approved, unexpired verification documents (audited needs a third-party audit)"}
            flags: {type: array, items: {type: string}, description: "e.g. verification_document_expired, verification_document_expiring, sanctions_hit, blocked_flag, price_anomaly, certification_expired, certification_expiring"}
    DocType: {type: string, enum: [business_license, company_registry_reference, bank_reference, export_license, factory_photos, iso_certificate, other_certificate]}
    VerificationDocumentIn:
      type: object
      additionalProperties: false
      required: [doc_type, issuing_country, files, consent]
      properties:
        doc_type: {$ref: "#/components/schemas/DocType"}
        issuing_country: {type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2}
        files: {type: array, minItems: 1, maxItems: 10, items: {type: string, maxLength: 2048}, description: "media-service paths /v1/media/files/<id>.<ext> (absolute URLs only for configured media hosts)"}
        number: {type: [string, "null"], minLength: 4, maxLength: 64, description: "Required for every type except factory_photos. Never stored in clear and never returned."}
        expires_on: {type: [string, "null"], format: date}
        consent: {type: boolean, description: Must be true}
    VerificationDocument:
      type: object
      required: [id, doc_type, issuing_country, files, status, created_at]
      properties:
        id: {type: string}
        doc_type: {$ref: "#/components/schemas/DocType"}
        issuing_country: {type: string}
        files: {type: array, items: {type: string}}
        number_masked: {type: [string, "null"], description: "'****' plus at most the last 4 characters"}
        expires_on: {type: [string, "null"], format: date}
        status: {type: string, enum: [pending, approved, rejected, withdrawn]}
        is_expired: {type: boolean}
        reason: {type: [string, "null"]}
        consent: {type: boolean}
        created_at: {type: string, format: date-time}
        reviewed_at: {type: [string, "null"], format: date-time}
    VerificationDocumentList:
      type: object
      required: [items, verification_level]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/VerificationDocument"}}
        verification_level: {type: string, enum: [none, basic, documented, audited]}
    AdminVerificationDocument:
      allOf:
        - $ref: "#/components/schemas/VerificationDocument"
        - type: object
          required: [supplier_id]
          properties:
            supplier_id: {type: string}
            reviewed_by: {type: [string, "null"]}
            approved_on: {type: [string, "null"], format: date}
            duplicate_elsewhere: {type: boolean, description: Another supplier holds an active document with the same number fingerprint}
    AdminVerificationDocumentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AdminVerificationDocument"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
    VerificationDecisionIn:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reason: {type: [string, "null"], maxLength: 500, description: Required for reject / revoke}
        expires_on: {type: [string, "null"], format: date}
    VerificationExpiryIn:
      type: object
      additionalProperties: false
      properties:
        expires_on: {type: [string, "null"], format: date}
        reason: {type: [string, "null"], maxLength: 500}
    VerificationAudit:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [seq, at, actor, action, document_id, supplier_id]
            properties:
              seq: {type: integer}
              at: {type: string, format: date-time}
              actor: {type: string}
              action: {type: string, enum: [submit, approve, reject, revoke, withdraw, set_expiry]}
              document_id: {type: string}
              supplier_id: {type: string}
              from_status: {type: [string, "null"]}
              to_status: {type: [string, "null"]}
              reason: {type: [string, "null"]}
              detail: {type: [string, "null"]}
    PublicVerification:
      type: object
      required: [supplier_id, verification_level, label, label_ar]
      properties:
        supplier_id: {type: string}
        verification_level: {type: string, enum: [none, basic, documented, audited]}
        label: {type: string}
        label_ar: {type: string}
        valid_types: {type: array, items: {$ref: "#/components/schemas/DocType"}}
    TrustHistory:
      type: object
      required: [supplier_id, points]
      properties:
        supplier_id: {type: string}
        points:
          type: array
          items:
            type: object
            required: [at, score, band, source]
            properties:
              at: {type: string, format: date-time}
              score: {type: integer, minimum: 0, maximum: 100}
              band: {type: string, enum: [green, yellow, red, unknown]}
              confidence: {type: [integer, "null"], minimum: 0, maximum: 100}
              source: {type: string, enum: [mock, snapshot]}
    SupplierReportIn:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: {type: string, enum: [fraud, counterfeit, non_delivery, quality, misrepresentation, unsafe_product, other]}
        text: {type: string, minLength: 1, maxLength: 1000}
    SupplierReport:
      type: object
      required: [id, supplier_id, type, text, status, created_at]
      properties:
        id: {type: string}
        supplier_id: {type: string}
        type: {type: string}
        text: {type: string}
        status: {type: string, enum: [pending_review, accepted, rejected]}
        created_at: {type: string, format: date-time}
        score_effect: {type: string, const: none_until_reviewed}
    SupplierSignals:
      type: object
      additionalProperties: false
      description: All fields optional; missing = unknown.
      properties:
        supplier_id: {type: string}
        years_in_business: {type: number, minimum: 0}
        verified: {type: boolean}
        third_party_audit: {type: boolean}
        transactions_count: {type: integer, minimum: 0}
        response_rate: {type: number, minimum: 0, maximum: 1}
        rating_avg: {type: number, minimum: 0, maximum: 5}
        reviews_count: {type: integer, minimum: 0}
        dispute_rate: {type: number, minimum: 0, maximum: 1}
        certifications: {type: array, items: {type: string}}
        domain_age_years: {type: number, minimum: 0}
        has_physical_address: {type: boolean}
        contact_consistency: {type: number, minimum: 0, maximum: 1}
        sanctions_hit: {type: boolean}
        price_vs_market_ratio: {type: number, exclusiveMinimum: 0}
        country_risk: {type: number, minimum: 0, maximum: 1}
        business_license_status: {type: string, enum: [verified, pending, unverified, expired, mismatch]}
        certification_records:
          type: array
          items: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, maxLength: 64}, expires_on: {type: [string, "null"], format: date}}}
        storefront_age_years: {type: number, minimum: 0}
        repeat_buyer_rate: {type: number, minimum: 0, maximum: 1}
        response_time_hours: {type: number, minimum: 0}
        dispute_rate_recent: {type: number, minimum: 0, maximum: 1}
        refund_rate: {type: number, minimum: 0, maximum: 1}
        deals_completed: {type: integer, minimum: 0}
        deals_cancelled: {type: integer, minimum: 0}
        confirmed_reports: {type: integer, minimum: 0}
        blocked: {type: boolean, description: "platform/compliance block: hard-fail red, score <= 20"}
        review_summary:
          type: object
          description: >-
            Optional verified-purchase review aggregates (same shape as rfq.yaml#ReviewSummary; decimals may be numbers or strings
            when produced by the trust rfq client, numbers here). Adds the bounded `platform_reviews` factor (max +-6 points),
            shrunk towards the prior and linearly dampened below 10 reviews. Never counted as a data gap when absent.
          properties:
            count: {type: integer, minimum: 0}
            average: {type: [number, "null"], minimum: 0, maximum: 5}
            histogram: {type: object, additionalProperties: {type: integer}}
            sub_ratings: {type: object, additionalProperties: {type: [number, "null"]}}
            completed_deals: {type: [integer, "null"], minimum: 0}
        verification:
          type: [object, "null"]
          description: >-
            Optional approved verification documents (type and dates only; no numbers or files). Adds the bounded, never-negative
            factors `document_verification` (max +6) and `facility_evidence` (max +4) and the `verification_level` badge.
            Filled automatically by the service for stored suppliers; inline here for ad-hoc evaluation.
          additionalProperties: false
          properties:
            documents:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [doc_type, approved_on]
                properties:
                  doc_type: {$ref: "#/components/schemas/DocType"}
                  approved_on: {type: string, format: date}
                  expires_on: {type: [string, "null"], format: date}
