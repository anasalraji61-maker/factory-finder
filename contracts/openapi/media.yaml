openapi: 3.1.0
info:
  title: Factory Finder media
  version: 0.1.0
  description: |
    Image upload and serving (listing photos, avatars, message attachments). Reached through the gateway at /v1/media.
    POST and DELETE need X-User-Id (401 otherwise; the gateway derives it from the bearer token). GET of image bytes
    (/v1/media/files/{id}.{ext}) is PUBLIC so that listing images can be referenced by an absolute URL
    `<FF_MEDIA_PUBLIC_BASE_URL>/v1/media/files/{id}.{ext}` from other services, native listings and the apps.
    Safety: only JPEG, PNG and WebP, decided by MAGIC BYTES (client content-type and filename are ignored); SVG, HTML,
    GIF and everything else is rejected with 415. The size limit (FF_MEDIA_MAX_UPLOAD_BYTES, default 5 MiB) is enforced while
    streaming; width and height are capped (default 8000 px) as a decompression-bomb guard. Every image is re-encoded
    (EXIF / GPS / ICC / text chunks are dropped, EXIF orientation is applied first; animated inputs keep their first frame).
    Ids are random 128-bit hex; an image is deduplicated per owner by the SHA-256 of the re-encoded bytes.
    Quotas per user (defaults): 200 stored files, 30 upload requests per rolling hour (429). Another user's image is 404 on DELETE.
    Deleted images may stay in downstream caches for the immutable cache lifetime.

    PRIVATE files (additive): upload with `visibility=private`, or `kind=verification` (always private; `visibility=public`
    with it is 422). Private bytes are NEVER served by the public `/v1/media/files/*` (404, indistinguishable from a missing
    file). They are readable only by (1) the owner (`X-User-Id`, i.e. an authenticated gateway request) at
    `/v1/media/private/{id}.{ext}`, (2) anyone holding a short-lived (default 5 min, `FF_MEDIA_SIGNING_KEY`) HMAC-signed URL
    for that file, bound to file id + owner + expiry, obtained by the owner from `POST /v1/media/files/{id}/sign`, and (3) an
    admin through the gateway passthrough `GET /v1/admin/media/files/{id}` (media: `GET /v1/media/admin/files/{id}`, service
    admin token). Responses carry `Cache-Control: private, no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`;
    there is no listing. The `url` of a private file is the relative reference `/v1/media/private/{id}.{ext}` (no query): that is
    what other services (trust verification documents) store; it is not fetchable without owner identity or a signature.
    Mobile clients: send `kind=verification` for supplier verification documents, put `url` into the trust `files[]`, and call
    `POST /v1/media/files/{id}/sign` to preview the document (open the returned URL within 5 minutes; it is not cacheable).
servers: [{url: http://localhost:8112}]
paths:
  /health:
    get: {operationId: health, responses: {"200": {description: ok}}}
  /ready:
    get:
      summary: Readiness (database reachable and storage writable)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: media}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: media}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/media/images:
    post:
      operationId: uploadImage
      summary: Upload an image (multipart/form-data)
      description: |
        Fields: `file` (required, exactly one), `kind` (optional: listing | avatar | attachment | verification, default listing) and `visibility` (optional: public | private, default public; verification is always private).
        Uploading the same pixels again as the same user returns the existing image with 200 instead of 201.
        Error codes: missing_user 401, file_too_large 413, unsupported_media_type 415, invalid_image 422,
        image_dimensions_exceeded 422, validation_error 422, quota_files_exceeded 429, quota_bytes_exceeded 429 (default 100 MiB of stored originals per user), quota_uploads_exceeded 429 (Retry-After).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                kind: {$ref: "#/components/schemas/MediaKind"}
                visibility: {$ref: "#/components/schemas/MediaVisibility"}
      responses:
        "200": {description: Same image already stored for this user, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImage"}}}}
        "201": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImage"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/media/images/{id}:
    delete:
      operationId: deleteImage
      summary: Delete an image (owner only; 404 for anyone else, never 403)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/media/files/{id}/sign:
    post:
      operationId: signPrivateFile
      summary: Owner only - short-lived signed URL for a private file (404 for anyone else, and for public files)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
      responses:
        "200": {description: Signed URL, headers: {Cache-Control: {schema: {type: string}, description: "private, no-store"}}, content: {application/json: {schema: {$ref: "#/components/schemas/SignedUrl"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/media/private/{filename}:
    get:
      operationId: getPrivateFile
      summary: Private file bytes (owner via X-User-Id, or a valid signed URL; otherwise 404)
      parameters:
        - {name: filename, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}\.(jpg|png|webp)$'}}
        - {name: u, in: query, required: false, schema: {type: string}, description: user the link was issued to}
        - {name: exp, in: query, required: false, schema: {type: integer}, description: expiry (unix seconds)}
        - {name: sig, in: query, required: false, schema: {type: string}, description: "hex HMAC-SHA256 over file id, user and expiry"}
      responses:
        "200":
          description: Image bytes
          headers:
            Cache-Control: {schema: {type: string}, description: "private, no-store"}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "206": {description: "Partial content (single `Range: bytes=a-b` honoured; multi-range is served whole). Responses add Accept-Ranges: bytes."}
        "404": {$ref: "#/components/responses/Error"}
        "416": {description: Range not satisfiable}
    head:
      operationId: headPrivateFile
      summary: Same access rules and headers as GET, no body (a failure is the same no-store 404)
      parameters:
        - {name: filename, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}\.(jpg|png|webp)$'}}
        - {name: u, in: query, required: false, schema: {type: string}}
        - {name: exp, in: query, required: false, schema: {type: integer}}
        - {name: sig, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Headers only}
        "404": {$ref: "#/components/responses/Error"}
  /v1/media/admin/files/{name}:
    get:
      operationId: adminGetFile
      summary: Admin read of any file (service admin token; 404 when unset, 401 wrong). Reached via gateway GET /v1/admin/media/files/{name}
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}(\.(jpg|png|webp))?$'}}
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    head:
      operationId: headAdminFile
      summary: Headers only
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}(\.(jpg|png|webp))?$'}}
      responses:
        "200": {description: Headers only}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/media/files/{filename}:
    get:
      operationId: getImageFile
      summary: Image bytes (PUBLIC, no auth)
      description: |
        `filename` is `<id>.<ext>` with ext jpg | png | webp as returned in `url`. Optional `w` selects a resized variant
        (only 200, 400, 800 are allowed; 422 otherwise); when the image is not wider than `w` the original is served.
        Immutable cache headers, ETag (If-None-Match gives 304), `X-Content-Type-Options: nosniff`, correct Content-Type,
        `Content-Security-Policy: default-src 'none'`. Unknown or malformed names are 404.
      parameters:
        - {name: filename, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}\.(jpg|png|webp)$'}}
        - {name: w, in: query, required: false, schema: {type: integer, enum: [200, 400, 800]}}
      responses:
        "200":
          description: Image bytes
          headers:
            Cache-Control: {schema: {type: string}, description: "public, max-age=31536000, immutable"}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            ETag: {schema: {type: string}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "206": {description: "Partial content (single Range honoured; Accept-Ranges: bytes)"}
        "304": {description: Not modified}
        "404": {$ref: "#/components/responses/Error"}
        "416": {description: Range not satisfiable}
        "422": {$ref: "#/components/responses/Error"}
    head:
      operationId: headImageFile
      summary: Headers only (same ETag / Content-Length as GET)
      parameters:
        - {name: filename, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}\.(jpg|png|webp)$'}}
        - {name: w, in: query, required: false, schema: {type: integer, enum: [200, 400, 800]}}
      responses:
        "200": {description: Headers only}
        "304": {description: Not modified}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: media}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: media}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller}
components:
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}
  schemas:
    MediaKind: {type: string, enum: [listing, avatar, attachment, verification], default: listing}
    MediaVisibility: {type: string, enum: [public, private], default: public}
    SignedUrl:
      type: object
      required: [url, expires_at, ttl_seconds]
      properties:
        url: {type: string, description: "<base>/v1/media/private/<id>.<ext>?u=<owner>&exp=<unix>&sig=<hex>"}
        expires_at: {type: string, format: date-time}
        ttl_seconds: {type: integer}
    MediaImage:
      type: object
      required: [id, url, width, height, bytes, content_type, sha256]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        url: {type: string, description: "absolute when FF_MEDIA_PUBLIC_BASE_URL is set, else a path: <base>/v1/media/files/<id>.<ext>; append ?w=200|400|800 for a resized variant"}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        bytes: {type: integer, minimum: 1, description: size of the stored (re-encoded) original}
        content_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of the stored bytes}
        kind: {$ref: "#/components/schemas/MediaKind"}
        visibility: {$ref: "#/components/schemas/MediaVisibility"}
        widths: {type: array, items: {type: integer, enum: [200, 400, 800]}, description: "variants that exist (those narrower than the original)"}
        created_at: {type: string, format: date-time}
