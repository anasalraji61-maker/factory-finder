openapi: 3.1.0
info: {title: Factory Finder gateway, version: 0.1.0, description: "Auth, profile, home feed and reverse proxy for all /v1/* service paths (see docs). Bearer JWT: access 15 min, refresh 30 days. Public: /health, /v1/auth/*, GET search/listings/suppliers/categories/recommendations/countries/cities/hubs/fx-rates, POST /v1/quotes/landed-cost, GET /v1/compliance/* + POST /v1/compliance/checklist, GET /v1/feed/trending (anonymous browsing), GET /v1/media/files/{id}.{ext} (image bytes; POST /v1/media/images and DELETE need a bearer token, see media.yaml). GET /v1/media/private/{id}.{ext} is reachable without a token but media only serves it to the owner (optional bearer) or with a valid short-lived signature; POST /v1/media/files/{id}/sign needs a bearer token."}
servers: [{url: http://localhost:8000}]
security: [{bearer: []}]
paths:
  /health:
    get: {operationId: health, security: [], responses: {"200": {description: ok}}}
  /ready:
    get:
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise. Gateway status is `degraded` (still 200) when only upstreams are down.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready, degraded]}
                  service: {type: string, const: gateway}
                  checks: {type: object, additionalProperties: {type: boolean}}
                  upstreams:
                    type: object
                    description: Reachability per upstream name (no URLs).
                    additionalProperties: {type: boolean}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: gateway}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/auth/register:
    post:
      operationId: register
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegisterIn"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Tokens"}}}}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginIn"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Tokens"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotating refresh - each refresh token is single-use; replaying a used one revokes the family (401)
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}}}
      responses:
        "200": {description: New token pair, content: {application/json: {schema: {$ref: "#/components/schemas/Tokens"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token's whole family (idempotent; always 204)
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}}}
      responses:
        "204": {description: Revoked}
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Sign out everywhere (revoke every refresh token and every access token issued so far)
      description: "Bearer required. Revokes all refresh tokens of the user and bumps the per-user token version, so access tokens carrying an older `tv` claim (this one included) answer 401 from then on. Sign in again to get a new session."
      responses:
        "204": {description: Signed out everywhere}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume an email verification token (single use, hashed at rest, TTL 24 h)
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}}}}}}
      responses:
        "204": {description: Email verified}
        "400": {$ref: "#/components/responses/Error"}
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Re-send the verification mail (always 202; no account enumeration; throttled per address)
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}}
      responses:
        "202": {description: Accepted, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
        "429": {$ref: "#/components/responses/Error"}
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a password reset mail (always 202 with an identical body; no account enumeration)
      description: "If the email belongs to an active account and a mail backend is configured, a single-use reset token (random, SHA-256 only at rest, TTL FF_GATEWAY_PASSWORD_RESET_TTL_SECONDS = 30 min) is mailed. Work happens after the response. Throttled silently (same 202) per email+IP (FF_GATEWAY_PASSWORD_FORGOT_PER_MINUTE) and per email (..._PER_EMAIL_PER_MINUTE); the per-IP auth limit still answers 429. A newer request invalidates older tokens."
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [email], properties: {email: {type: string, format: email}}}}}}
      responses:
        "202": {description: Accepted, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset token (single use)
      description: "Unknown, expired, used or stale token -> one generic 400 `invalid_reset_token`. The new password must satisfy the registration policy (422; the token is not consumed then). On success every refresh token of the user is revoked; sign in again."
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [token, new_password], properties: {token: {type: string}, new_password: {type: string, minLength: 8, maxLength: 128}}}}}}
      responses:
        "204": {description: Password changed}
        "400": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/me/password:
    post:
      operationId: changePassword
      summary: Change my password (re-auth with the current one)
      description: "Revokes every refresh token of the user and invalidates all earlier access tokens (per-user token version) and returns a fresh token pair for this device (no `user`). Wrong current password -> 403 `reauth_failed`; failures are throttled per user (FF_GATEWAY_LOGIN_FAIL_LIMIT_PER_MINUTE, then 429). The new password must satisfy the registration policy and differ from the current one (422)."
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [current_password, new_password], properties: {current_password: {type: string}, new_password: {type: string, minLength: 8, maxLength: 128}}}}}}
      responses:
        "200": {description: Password changed; new session, content: {application/json: {schema: {$ref: "#/components/schemas/Tokens"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200": {description: Profile, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "401": {$ref: "#/components/responses/Error"}
    patch:
      operationId: patchMe
      description: "Changing or removing `email` requires `current_password` (422 if missing, 403 `reauth_failed` if wrong; failures throttled per user). The previous address is notified when mail is on."
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MePatch"}}}}
      responses:
        "200": {description: Updated profile, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteMe
      summary: Delete my account (store requirement)
      description: "Re-auth with the current `password` or a current unused `refresh_token`. Revokes all sessions, then soft-deletes and anonymizes (scrubs email/phone/name/company/destination/supplier claim; the id stays) and erases or anonymizes the user's data in every service via durable, retried jobs. FF_GATEWAY_DELETION_GRACE_DAYS (default 0) delays the anonymization; a login with the right password inside the grace period cancels it. Idempotent: repeating it reports status and retries pending services. 200 when every service is done, 202 when scheduled or partial. Rate limited per user (FF_GATEWAY_PRIVACY_RATE_LIMIT_PER_MINUTE). Retention exceptions: docs/decisions/account-deletion.md."
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeleteAccountIn"}}}}
      responses:
        "200": {description: Deleted (all services done), content: {application/json: {schema: {$ref: "#/components/schemas/DeletionStatus"}}}}
        "202": {description: Scheduled (grace period) or partial (some services pending/failed and being retried), content: {application/json: {schema: {$ref: "#/components/schemas/DeletionStatus"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/me/export:
    get:
      operationId: exportMe
      summary: Download my data (privacy export)
      description: "JSON bundle (attachment) with the profile and what each service holds about the user, produced by fan-out with per-call timeouts. A failing service is reported in `services.<name>` (`status: error`, short `error` code) and sets `partial: true`; the bundle is capped (FF_GATEWAY_EXPORT_MAX_BYTES, default 5 MiB) and streamed. Rate limited per user."
      responses:
        "200":
          description: Export bundle
          headers: {Content-Disposition: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ExportBundle"}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/admin/account-deletions:
    get:
      operationId: listAccountDeletionJobs
      description: "Admin only (X-Admin-Token; 404 unset, 401 wrong). Erasure jobs that have not completed: opaque user id, service, attempts, short error code. No PII."
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, dead], default: pending}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200": {description: Open jobs, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {user_id: {type: string}, service: {type: string}, status: {type: string}, attempts: {type: integer}, last_error: {type: [string, "null"]}, next_attempt_at: {type: string, format: date-time}}}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/supplier-claims:
    get:
      operationId: listSupplierClaims
      description: "Admin only: header X-Admin-Token must equal FF_GATEWAY_ADMIN_TOKEN. 404 when the token is not configured, 401 when missing/wrong."
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, verified], default: pending}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: Claims (one page, oldest first), content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/SupplierClaim"}}, total: {type: integer}, page: {type: integer}, page_size: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/supplier-claims/{user_id}/approve:
    post:
      operationId: approveSupplierClaim
      description: "Admin only (X-Admin-Token). Pending -> verified; 409 claim_not_pending otherwise."
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Updated claim, content: {application/json: {schema: {$ref: "#/components/schemas/SupplierClaim"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/admin/supplier-claims/{user_id}/reject:
    post:
      operationId: rejectSupplierClaim
      description: "Admin only (X-Admin-Token). Pending -> released (supplier_id cleared, status none); 409 claim_not_pending otherwise."
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Updated claim, content: {application/json: {schema: {$ref: "#/components/schemas/SupplierClaim"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/admin/supplier-claims/{user_id}/revoke:
    post:
      operationId: revokeSupplierClaim
      description: "Admin only (X-Admin-Token). Verified -> released (supplier_id cleared, status none, X-Supplier-Id stops at once); 409 claim_not_verified otherwise; 422 without a reason. Optional X-Reviewer (sanitized: charset [A-Za-z0-9_.:-], max 64, so no '@') is recorded in the audit log, default admin. approve/reject also accept an optional {reason} body and are audited. Reject/revoke and PATCH /v1/me releasing or changing supplier_id also call trust POST /v1/admin/trust/verification/suppliers/{id}/release for the old id (best-effort, 3 s timeout, only when FF_TRUST_ADMIN_TOKEN is set; failures are logged and never fail the request)."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
        - {name: X-Reviewer, in: header, required: false, schema: {type: string, maxLength: 64}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}}}
      responses:
        "200": {description: Updated claim, content: {application/json: {schema: {$ref: "#/components/schemas/SupplierClaim"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/admin/supplier-claims/audit:
    get:
      operationId: listSupplierClaimAudit
      description: "Admin only (X-Admin-Token). Append-only claim decision log (approve, reject, revoke, self_release), newest first."
      parameters:
        - {name: user_id, in: query, schema: {type: string, maxLength: 40}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200": {description: Decisions, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {id: {type: integer}, user_id: {type: string}, supplier_id: {type: string}, action: {type: string, enum: [approve, reject, revoke, self_release]}, previous_status: {type: string}, new_status: {type: string}, reviewer: {type: string}, reason: {type: [string, "null"]}, created_at: {type: string, format: date-time}}}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/overview:
    get:
      operationId: adminOverview
      description: "Admin only (X-Admin-Token; 404 unset, 401 wrong)."
      responses:
        "200": {description: Counts, content: {application/json: {schema: {type: object, properties: {pending_supplier_claims: {type: integer}, pending_drafts: {type: [integer, "null"], description: "null when demand is unreachable"}, users: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/signals:
    get:
      operationId: adminListSignals
      description: "Admin only (X-Admin-Token). Proxied to demand GET /v1/signals with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      operationId: adminImportSignal
      description: "Admin only (X-Admin-Token). Proxied to demand POST /v1/signals; status and body pass through."
      responses:
        "200": {description: Upstream demand response}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/signals/poll:
    post:
      operationId: adminPollSignals
      description: "Admin only (X-Admin-Token). Proxied to demand POST /v1/signals/poll with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/drafts:
    get:
      operationId: adminListDrafts
      description: "Admin only (X-Admin-Token). Proxied to demand GET /v1/drafts (?status=) with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/quota:
    get:
      operationId: adminDemandQuota
      description: "Admin only (X-Admin-Token). Proxied to demand GET /v1/quota with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/drafts/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      operationId: adminGetDraft
      description: "Admin only (X-Admin-Token). Proxied to demand GET /v1/drafts/{id} with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/drafts/{id}/approve:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      operationId: adminApproveDraft
      description: "Admin only (X-Admin-Token). Proxied to demand POST /v1/drafts/{id}/approve with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/drafts/{id}/reject:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      operationId: adminRejectDraft
      description: "Admin only (X-Admin-Token). Proxied to demand POST /v1/drafts/{id}/reject with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/drafts/{id}/mark-published:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      operationId: adminMarkPublishedDraft
      description: "Admin only (X-Admin-Token). Proxied to demand POST /v1/drafts/{id}/mark-published with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/drafts/{id}/outcome:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      operationId: adminOutcomeDraft
      description: "Admin only (X-Admin-Token). Proxied to demand POST /v1/drafts/{id}/outcome with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/demand/signals/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      operationId: adminGetSignal
      description: "Admin only (X-Admin-Token). Proxied to demand GET /v1/signals/{id} with X-User-Id=admin; client identity headers are never forwarded; demand status codes pass through."
      responses:
        "200": {description: Upstream demand response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/payments/outbox:
    get:
      operationId: adminPaymentsOutboxList
      description: "Admin only (X-Admin-Token; 404 when FF_GATEWAY_ADMIN_TOKEN or FF_PAYMENTS_ADMIN_TOKEN is unset, 401 wrong). Proxied to payments GET /v1/payments/outbox; gateway injects payments' X-Admin-Token and X-Internal-Token (X-User-Id=admin); client identity headers never forwarded. Only status/limit/cursor (plus upstream page/page_size) are accepted, others 422; limit maps to page_size (max 100)."
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, delivered, dead]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: Upstream payments response (see payments.yaml listOutbox)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/admin/payments/outbox/{id}/requeue:
    post:
      operationId: adminPaymentsOutboxRequeue
      description: "Admin only, same guards as the list route. Proxied to payments POST /v1/payments/outbox/{id}/requeue (no body, no query). Upstream 404/409 pass through."
      parameters: [{name: id, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}}]
      responses:
        "200": {description: Upstream payments response (requeued OutboxEvent)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/media/files/{name}:
    get:
      operationId: adminMediaFileGet
      description: "Admin only (X-Admin-Token; 404 when FF_GATEWAY_ADMIN_TOKEN or FF_MEDIA_ADMIN_TOKEN is unset, 401 wrong). Reads a private (or any) media file from media GET /v1/media/admin/files/{name}; the gateway injects media's X-Admin-Token and X-Internal-Token (X-User-Id=admin); client identity/admin headers and query strings are never forwarded (any query is 404). Response: image bytes with Cache-Control private, no-store and nosniff. No listing. Used by the admin console to view verification documents."
      parameters: [{name: name, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}(\\.(jpg|png|webp))?$'}}]
      responses:
        "200": {description: Image bytes (image/jpeg, image/png or image/webp)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/moderation/{path}:
    parameters: [{name: path, in: path, required: true, schema: {type: string}, description: "Remainder of the sourcing path, may contain slashes (see sourcing.yaml /v1/admin/moderation/*)"}]
    get: &adminModeration
      operationId: adminModerationGet
      description: "Admin only (X-Admin-Token; 404 when FF_GATEWAY_ADMIN_TOKEN or FF_SOURCING_ADMIN_TOKEN is unset). Proxied to sourcing /v1/admin/moderation/{path}; the gateway injects sourcing's X-Admin-Token and X-Internal-Token with X-User-Id=admin; client identity/admin headers are never forwarded; sourcing status codes pass through. Methods GET/POST/PUT/PATCH/DELETE."
      responses:
        "200": {description: Upstream sourcing response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post: {<<: *adminModeration, operationId: adminModerationPost}
    put: {<<: *adminModeration, operationId: adminModerationPut}
    patch: {<<: *adminModeration, operationId: adminModerationPatch}
    delete: {<<: *adminModeration, operationId: adminModerationDelete}
  /v1/admin/trust/verification/{path}:
    parameters: [{name: path, in: path, required: true, schema: {type: string}, description: "Remainder of the trust admin path, may contain slashes"}]
    get: &adminTrustVerification
      operationId: adminTrustVerificationGet
      description: "Admin only (X-Admin-Token; 404 when FF_GATEWAY_ADMIN_TOKEN or FF_TRUST_ADMIN_TOKEN is unset, 401 wrong). Allow-listed passthrough to trust /v1/admin/trust/verification/{path} (GET documents, POST documents/{id}/decision, PUT documents/{id}/expiry, GET audit; X-Reviewer is forwarded sanitized (charset [A-Za-z0-9_.:-], max 64, default admin) for the audit log); anything else 404. Path ids must match [A-Za-z0-9_-]{1,64}, unknown query params 422. The gateway injects the service's X-Admin-Token and X-Internal-Token with X-User-Id=admin; client identity/admin headers are never forwarded; upstream status codes pass through."
      responses:
        "200": {description: Upstream trust response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post: {<<: *adminTrustVerification, operationId: adminTrustVerificationPost}
    put: {<<: *adminTrustVerification, operationId: adminTrustVerificationPut}
    patch: {<<: *adminTrustVerification, operationId: adminTrustVerificationPatch}
    delete: {<<: *adminTrustVerification, operationId: adminTrustVerificationDelete}
  /v1/admin/freight/{path}:
    parameters: [{name: path, in: path, required: true, schema: {type: string}, description: "Remainder of the freight admin path, may contain slashes"}]
    get: &adminFreight
      operationId: adminFreightGet
      description: "Admin only (X-Admin-Token; 404 when FF_GATEWAY_ADMIN_TOKEN or FF_FREIGHT_ADMIN_TOKEN is unset, 401 wrong). Allow-listed passthrough to freight /v1/admin/freight/{path} (applications list + approve/reject, forwarders list + suspend/reinstate, requests/quotes list + hide/restore, reports, POST sweep); anything else 404. Path ids must match [A-Za-z0-9_-]{1,64}, unknown query params 422. The gateway injects the service's X-Admin-Token and X-Internal-Token with X-User-Id=admin; client identity/admin headers are never forwarded; upstream status codes pass through."
      responses:
        "200": {description: Upstream freight response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post: {<<: *adminFreight, operationId: adminFreightPost}
    put: {<<: *adminFreight, operationId: adminFreightPut}
    patch: {<<: *adminFreight, operationId: adminFreightPatch}
    delete: {<<: *adminFreight, operationId: adminFreightDelete}
  /v1/admin/feed/{path}:
    parameters: [{name: path, in: path, required: true, schema: {type: string}, description: "Remainder of the feed admin path, may contain slashes"}]
    get: &adminFeed
      operationId: adminFeedGet
      description: "Admin only (X-Admin-Token; 404 when FF_GATEWAY_ADMIN_TOKEN or FF_FEED_ADMIN_TOKEN is unset, 401 wrong). Allow-listed passthrough to feed /v1/admin/feed/{path} (posts/comments list + hide/restore, reports); anything else 404. Path ids must match [A-Za-z0-9_-]{1,64}, unknown query params 422. The gateway injects the service's X-Admin-Token and X-Internal-Token with X-User-Id=admin; client identity/admin headers are never forwarded; upstream status codes pass through."
      responses:
        "200": {description: Upstream feed response (status and body passed through)}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    post: {<<: *adminFeed, operationId: adminFeedPost}
    put: {<<: *adminFeed, operationId: adminFeedPut}
    patch: {<<: *adminFeed, operationId: adminFeedPatch}
    delete: {<<: *adminFeed, operationId: adminFeedDelete}
  /v1/home:
    get:
      operationId: getHome
      description: Aggregated feed. A failing section is null and listed in warnings.
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {type: object}
                  categories: {type: [array, "null"]}
                  trending: {type: [array, "null"]}
                  fx: {type: [object, "null"]}
                  warnings: {type: array, items: {type: object, properties: {section: {type: string}, message: {type: string}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/{proxied_path}:
    x-proxy:
      sourcing: [/v1/search, /v1/listings, /v1/suppliers, /v1/categories, /v1/sources, /v1/my, /v1/recommendations]  # GET /v1/recommendations is public (client sends recent ids; nothing stored); POST /v1/listings/{id}/events (view|contact_click|share) is public with optional bearer: the gateway forwards X-User-Id (if signed in) and X-Client-Ip (resolved via FF_GATEWAY_TRUSTED_PROXIES, never client-supplied) only as transient input to a daily-salted hash in sourcing, nothing per-viewer is stored; GET /v1/my/analytics needs a bearer token and forwards X-Supplier-Id only for a verified claim
      logistics: [/v1/quotes, /v1/fx, /v1/carriers, /v1/hs, /v1/compliance]  # GET /v1/compliance/* and POST /v1/compliance/checklist are public (static indicative data; same rate-limit class as landed-cost)
      geo: [/v1/countries, /v1/cities, /v1/hubs, /v1/distance]
      trust: [/v1/trust]  # /v1/trust/verification/* (supplier documents) needs a verified supplier claim (403 supplier_claim_required otherwise; X-Supplier-Id forwarded from the DB, JSON body <= 64 KiB, non-GET needs a verified email when FF_GATEWAY_REQUIRE_EMAIL_VERIFIED is on); GET /v1/trust/suppliers/{id}/verification (badge) is public; the rest of /v1/trust needs a bearer token
      rfq: [/v1/requests, /v1/offers, /v1/deals, /v1/reviews, "GET /v1/suppliers/{ref}/reviews", "GET /v1/suppliers/{ref}/review-summary"]  # the two supplier paths are public and take precedence over the sourcing /v1/suppliers prefix
      messaging: [/v1/conversations, /v1/blocks]  # all need a bearer token; X-Supplier-Id is forwarded for a verified claim (blocks by a supplier owner also apply to the supplier identity)
      tracking: [/v1/shipments, /v1/validate]
      notifications: [/v1/watchlist, /v1/alerts, /v1/devices]
      assistant: [/v1/assistant]
      media: [/v1/media]
      feed: [/v1/feed]  # GET /v1/feed/trending is public; POST /v1/feed/posts needs a verified supplier claim (X-Supplier-Id forwarded) and, when FF_GATEWAY_REQUIRE_EMAIL_VERIFIED is on, a verified email. /v1/admin/feed/* is an admin-only passthrough (see below)
      freight: [/v1/freight]  # every route needs a bearer token; POST /v1/freight/applications and POST /v1/freight/requests need a verified email when FF_GATEWAY_REQUIRE_EMAIL_VERIFIED is on. Forwarder status is resolved inside freight from X-User-Id (client-sent X-Forwarder-Id / X-Supplier-Id are never forwarded). /v1/admin/freight/* is an admin-only passthrough (see below)
    get:
      operationId: proxy
      description: "Reverse proxy by prefix (x-proxy). Adds X-User-Id, X-Internal-Token (if configured), X-Request-Id. Upstream down -> 502 upstream_unavailable; timeout -> 504; circuit open after repeated failures -> 503 upstream_unavailable with Retry-After (fast-fail, details.circuit=open)."
      parameters: [{name: proxied_path, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Upstream response passed through}
        "401": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/ws-ticket:
    post:
      operationId: wsTicket
      summary: Single-use websocket ticket (30 s) so the access token never appears in a URL
      responses:
        "200": {description: "Ticket bound to the caller; pass as ?ticket= on /v1/ws/conversations/{id}", content: {application/json: {schema: {type: object, required: [ticket, expires_in], properties: {ticket: {type: string}, expires_in: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/ws/conversations/{conversation_id}:
    get:
      operationId: wsConversation
      description: "WebSocket proxy to messaging (same frames as messaging.yaml). Auth: ?ticket= from POST /v1/ws-ticket (preferred; single use), or (legacy, off by default: FF_GATEWAY_WS_ALLOW_TOKEN_PARAM=true) Authorization Bearer access token / ?token= query. Only verified X-User-Id/X-Supplier-Id are forwarded upstream. Close codes: 4401 unauthenticated, 4403 forbidden, 4404 unknown path, 4429 too many connections (per-user cap FF_GATEWAY_WS_MAX_CONNECTIONS_PER_USER, default 5, or the per-IP HTTP rate limit), 1011 upstream unavailable, 1009 client frame too large (oversized frames are never relayed), 1001 session lifetime elapsed (FF_GATEWAY_WS_MAX_SESSION_SECONDS, default 4 h; reconnect with a fresh ticket)."
      parameters:
        - {name: conversation_id, in: path, required: true, schema: {type: string}}
        - {name: ticket, in: query, required: false, schema: {type: string}}
        - {name: token, in: query, required: false, schema: {type: string}, deprecated: true}
      responses:
        "101": {description: Switching Protocols}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}}
  schemas:
    DeleteAccountIn:
      type: object
      additionalProperties: false
      description: At least one of password or refresh_token is required.
      properties: {password: {type: string}, refresh_token: {type: string}}
    DeletionStatus:
      type: object
      required: [status, services]
      properties:
        status: {type: string, enum: [scheduled, partial, deleted]}
        scheduled_for: {type: [string, "null"], format: date-time}
        deleted_at: {type: [string, "null"], format: date-time}
        services: {type: object, additionalProperties: {type: string, enum: [done, pending, failed]}}
    ExportBundle:
      type: object
      required: [format_version, generated_at, user, services, partial]
      properties:
        format_version: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        user: {type: object, additionalProperties: true}
        partial: {type: boolean}
        services:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: {type: string, enum: [ok, error]}
              error: {type: string, description: "timeout | unavailable | too_large | size_cap | bad_response | http_<code> | not_configured"}
              truncated: {type: boolean}
              data: {type: object, additionalProperties: true}
    RegisterIn:
      type: object
      required: [password, name]
      description: At least one of email or phone is required.
      properties:
        email: {type: string, format: email}
        phone: {type: string, description: "7-15 digits, optional +"}
        password: {type: string, minLength: 8}
        name: {type: string}
    LoginIn:
      type: object
      required: [password]
      properties: {email: {type: string, format: email}, phone: {type: string}, password: {type: string}}
    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, enum: [bearer]}
        expires_in: {type: integer}
        user: {oneOf: [{$ref: "#/components/schemas/Me"}, {type: "null"}]}
    Me:
      type: object
      required: [id, name, role, display_currency, language, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: [string, "null"]}
        phone: {type: [string, "null"]}
        company: {type: [string, "null"]}
        role: {type: string, enum: [buyer, supplier, both]}
        default_destination: {oneOf: [{$ref: "../schemas/common.schema.json#/$defs/Location"}, {type: "null"}]}
        display_currency: {$ref: "../schemas/common.schema.json#/$defs/CurrencyCode"}
        language: {type: string, enum: [ar, en]}
        supplier_id: {type: [string, "null"], description: "Catalog supplier (sup_*) this user has claimed; lets them answer chats addressed to it only once supplier_claim_status is verified"}
        supplier_claim_status: {type: string, enum: [none, pending, verified], default: none, description: "none = no claim; pending = awaiting admin review (no supplier access yet); verified = approved"}
        email_verified: {type: boolean, default: false, description: "true once the account email was confirmed via /v1/auth/verify-email; payments writes, supplier claims and /v1/my writes answer 403 email_not_verified when it is false and FF_GATEWAY_REQUIRE_EMAIL_VERIFIED is on"}
        created_at: {type: string, format: date-time}
    SupplierClaim:
      type: object
      properties:
        user_id: {type: string}
        name: {type: string}
        email: {type: [string, "null"]}
        phone: {type: [string, "null"]}
        company: {type: [string, "null"]}
        supplier_id: {type: [string, "null"]}
        supplier_claim_status: {type: string, enum: [none, pending, verified]}
    MePatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        current_password: {type: string, description: "Required when `email` changes"}
        company: {type: string}
        role: {type: string, enum: [buyer, supplier, both]}
        default_destination: {$ref: "../schemas/common.schema.json#/$defs/Location"}
        display_currency: {$ref: "../schemas/common.schema.json#/$defs/CurrencyCode"}
        language: {type: string, enum: [ar, en]}
        supplier_id: {type: [string, "null"], pattern: "^sup_[A-Za-z0-9_.:-]{1,59}$", description: "Claim a catalog supplier. Records a PENDING claim until an admin approves it. Pending or verified claims are unique (409 supplier_claimed otherwise); null releases it and resets status to none."}
