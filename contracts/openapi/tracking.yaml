openapi: 3.1.0
info:
  title: Factory Finder - tracking
  version: 0.1.0
servers:
  - url: http://localhost:8107
paths:
  /v1/internal/outbox-status:
    get:
      operationId: outboxStatus
      summary: Notification outbox / relay counters (internal; X-Internal-Token when FF_INTERNAL_TOKEN is set; no X-User-Id)
      responses:
        "404": {description: Error, content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
        "200":
          description: Counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  relay: {type: string, enum: [on, off]}
                  pending: {type: integer, description: "undelivered and not dead"}
                  retrying: {type: integer}
                  dead: {type: integer, description: "invalid or max attempts reached; kept for inspection"}
                  delivered: {type: integer}
                  oldest_pending_at: {type: [string, "null"], format: date-time}
  /health:
    get:
      operationId: getHealth
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: tracking}
                  version: {type: string}
  /ready:
    get:
      operationId: ready
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: tracking}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: tracking}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/shipments:
    post:
      operationId: createShipments
      summary: Track a container / bill of lading / air waybill / vessel IMO (idempotent per user+reference -> 409 duplicate_shipment)
      parameters: [{$ref: "#/components/parameters/UserId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ShipmentCreate"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Shipment"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    get:
      operationId: listShipments
      summary: My shipments, newest first
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ShipmentStatus"}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/Shipment"}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/shipments/{id}:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getShipmentsById
      summary: Shipment with its event timeline (404 if not owned by the caller)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Shipment"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteShipmentsById
      summary: Stop tracking
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/shipments/{id}/refresh:
    post:
      operationId: createShipmentsByIdRefresh
      summary: Pull the latest events from the provider
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Refreshed, content: {application/json: {schema: {$ref: "#/components/schemas/Shipment"}}}}
        "404": {$ref: "#/components/responses/Error"}
        "429":
          description: Refreshed too recently (code refresh_throttled, details.retry_after_seconds)
          headers: {Retry-After: {schema: {type: integer}}}
          content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}
        "502": {$ref: "#/components/responses/Error"}
  /v1/validate/{reference_type}/{reference}:
    get:
      operationId: getValidateByReferenceTypeByReference
      summary: Validate a reference (ISO 6346 / AWB mod-7 / IMO check digit / basic B/L) and detect the carrier
      parameters:
        - {name: reference_type, in: path, required: true, schema: {$ref: "#/components/schemas/ReferenceType"}}
        - {name: reference, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Always 200; see `valid`
          content:
            application/json:
              schema:
                examples: [
                  {
                    "reference": "CSQU3054383",
                    "reference_type": "container",
                    "valid": true,
                    "normalized": "CSQU3054383",
                    "reason": null,
                    "mode": "sea",
                    "carrier": null,
                    "suggestions": [],
                    "carrier_suggestion": null
                  },
                  {
                    "reference": "CSQU3054384",
                    "reference_type": "container",
                    "valid": false,
                    "normalized": "CSQU3054384",
                    "reason": "check_digit",
                    "mode": "sea",
                    "carrier": null,
                    "suggestions": [],
                    "carrier_suggestion": null
                  }
                ]
                type: object
                required: [reference, reference_type, valid, normalized]
                properties:
                  reference: {type: string}
                  reference_type: {$ref: "#/components/schemas/ReferenceType"}
                  valid: {type: boolean}
                  normalized: {type: string}
                  reason: {type: [string, "null"], description: "format... | check_digit"}
                  mode: {type: string, enum: [sea, air]}
                  carrier: {oneOf: [{$ref: "#/components/schemas/Carrier"}, {type: "null"}]}
                  suggestions:
                    type: array
                    items: {type: string}
                    description: "Valid alternatives when the input looks like a typo (O/0, I/1 ...); max 3, empty when none"
                  carrier_suggestion:
                    description: "Indicative carrier guess from the bundled directory (container owner / B/L SCAC / AWB prefix); null when unknown or a leasing company. Never overrides a carrier the user chose."
                    oneOf:
                      - type: object
                        required: [code, name, basis, confidence, as_of, indicative]
                        properties:
                          code: {type: string}
                          name: {type: string}
                          name_ar: {type: [string, "null"]}
                          scac: {type: [string, "null"]}
                          iata_code: {type: [string, "null"]}
                          awb_prefix: {type: [string, "null"]}
                          basis: {type: string, enum: [container_owner_prefix, bl_scac_prefix, awb_prefix]}
                          confidence: {type: string, enum: [high, medium, low]}
                          as_of: {type: string, description: "Directory vintage, YYYY-MM"}
                          indicative: {type: boolean}
                      - type: "null"
        "422": {$ref: "#/components/responses/Error"}
  /v1/references/detect:
    get:
      summary: Guess the reference type (container / AWB / IMO / B/L) from free text; local only, no network
      operationId: detectReferenceType
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        "200":
          description: Ranked candidates (empty when nothing fits). `high` only when exactly one type fits; overlapping shapes are capped at `medium`.
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [type, confidence, normalized, note]
                      properties:
                        type: {$ref: "#/components/schemas/ReferenceType"}
                        confidence: {type: string, enum: [high, medium, low]}
                        normalized: {type: string}
                        note: {type: string}
        "422": {$ref: "#/components/responses/Error"}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: tracking}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller, content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: tracking}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller, content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_.:@+\-]{1,128}$'}
  responses:
    Error:
      description: Error body
      content:
        application/json:
          schema: {$ref: ../schemas/common.schema.json#/$defs/Error}
  schemas:
    ReferenceType: {type: string, enum: [container, bl, awb, vessel_imo]}
    ShipmentStatus:
      type: string
      enum: [booked, gate_in, loaded, departed, in_transit, transshipment, arrived, discharged, customs_hold, released, out_for_delivery, delivered, exception]
    ShipmentCreate:
      example: {
        "reference": "CSQU3054383",
        "reference_type": "container",
        "label": "chairs"
      }
      type: object
      required: [reference, reference_type]
      additionalProperties: false
      properties:
        reference: {type: string}
        reference_type: {$ref: "#/components/schemas/ReferenceType"}
        carrier: {type: string, description: Optional carrier code or name; detected from the reference when omitted}
        label: {type: string}
    Carrier:
      type: object
      required: [name]
      properties:
        code: {type: [string, "null"]}
        name: {type: string}
        name_ar: {type: [string, "null"]}
        scac: {type: [string, "null"]}
        iata_code: {type: [string, "null"]}
        awb_prefix: {type: [string, "null"]}
    EventLocation:
      type: object
      required: [name]
      properties:
        name: {type: string}
        name_ar: {type: [string, "null"]}
        country_code: {type: [string, "null"]}
        hub_id: {type: [string, "null"], description: UN/LOCODE or IATA}
        point: {oneOf: [{$ref: ../schemas/common.schema.json#/$defs/GeoPoint}, {type: "null"}]}
    TrackingEvent:
      type: object
      required: [id, status, description, description_ar, timestamp, source]
      properties:
        id: {type: string}
        status: {$ref: "#/components/schemas/ShipmentStatus"}
        description: {type: string}
        description_ar: {type: string}
        location: {oneOf: [{$ref: "#/components/schemas/EventLocation"}, {type: "null"}]}
        timestamp: {type: string, format: date-time}
        vessel: {type: [object, "null"], properties: {name: {type: string}, imo: {type: [string, "null"]}, voyage: {type: [string, "null"]}}}
        flight: {type: [object, "null"], properties: {number: {type: string}, carrier_code: {type: [string, "null"]}}}
        source: {type: string}
    Shipment:
      example: {
        "id": "shp_c05fd09ff0ff404ab4462bc9f7a6a1d7",
        "owner_id": "eb4ad84e-14a5-4681-bcb2-91db2490c1db",
