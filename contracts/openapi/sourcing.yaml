openapi: 3.1.0
info:
  title: Factory Finder - sourcing
  version: 0.1.0
servers:
  - url: http://localhost:8002
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: sourcing}
                  version: {type: string}
  /ready:
    get:
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: sourcing}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: sourcing}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/search:
    get:
      summary: Search listings across enabled sources (Arabic or English query)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: kind, in: query, schema: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}}
        - {name: condition, in: query, schema: {type: string, enum: [new, used, refurbished, any], default: any}}
        - {name: origin_country, in: query, schema: {$ref: ../schemas/common.schema.json#/$defs/CountryCode}}
        - {name: category, in: query, description: Category or kind slug from /v1/categories, schema: {type: string}}
        - {name: min_price, in: query, description: Unit price floor in USD, schema: {type: number, minimum: 0}}
        - {name: max_price, in: query, description: Unit price cap in USD, schema: {type: number, minimum: 0}}
        - {name: moq_max, in: query, schema: {type: integer, minimum: 0}}
        - {name: verified_only, in: query, schema: {type: boolean, default: false}}
        - {name: sort, in: query, description: "Result order; ties always break by relevance score then id", schema: {type: string, enum: [relevance, price_asc, price_desc, trust, moq], default: relevance}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page of ranked results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    required: [sources]
                    properties:
                      facets:
                        type: object
                        description: Counts over the full matched set (all pages), each list ordered by count desc then value
                        properties:
                          kind: &facet {type: array, items: {type: object, required: [value, count], properties: {value: {type: string}, count: {type: integer}}}}
                          condition: *facet
                          origin_country: *facet
                          category: *facet
                      items:
                        type: array
                        items: {$ref: ../schemas/common.schema.json#/$defs/Listing}
                      sources:
                        type: array
                        items:
                          type: object
                          required: [source, status, count]
                          properties:
                            source: {type: string}
                            status: {type: string, enum: [ok, timeout, error]}
                            count: {type: integer}
                            warning: {type: [string, "null"], description: "Optional; set when a real source failed and mock results were used instead"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/listings/{id}:
    get:
      summary: Listing detail
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Listing with description and specs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ListingDetail"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/suppliers/{id}:
    get:
      summary: Supplier profile (with trust band)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/categories:
    get:
      summary: Bilingual category tree (top level = listing kinds)
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CategoryNode"}
  /v1/sources:
    get:
      summary: Registered sources, enabled flag, health and compliance note
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, mode, enabled, configured, status, compliance]
                  properties:
                    id: {type: string}
                    name: {type: string}
                    mode: {type: string, enum: [mock, official_api, licensed_feed, native]}
                    enabled: {type: boolean}
                    configured: {type: boolean}
                    status: {type: string, enum: [ok, error, timeout, disabled]}
                    compliance: {type: string}
  /v1/my/listings:
    post:
      summary: Create a listing owned by the calling (verified) supplier; starts as draft
      description: |
        Identity is the gateway-set X-Supplier-Id (only forwarded for an admin-verified claim); it is never read from the
        body (supplier/source/status/id fields in the body are ignored). 403 supplier_required without it; when
        FF_INTERNAL_TOKEN is configured, calls lacking a valid X-Internal-Token get 401. At most 200 listings per
        supplier (409 listing_cap_reached) and 30 creates per hour (429 rate_limited + Retry-After).
      parameters:
        - {$ref: "#/components/parameters/SupplierId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ListingWrite"}
      responses:
        "201":
          description: Created (status draft, id nat_xxxxxxxx)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    get:
      summary: List the caller's own listings (all statuses), newest first
      parameters:
        - {$ref: "#/components/parameters/SupplierId"}
        - {name: status, in: query, schema: {type: string, enum: [draft, published, archived]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/OwnedListing"}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/my/listings/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {$ref: "#/components/parameters/SupplierId"}
    get:
      summary: One of the caller's listings (404 for anyone else's)
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      summary: Replace the listing's content (status is unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ListingWrite"}
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      summary: Permanently delete the listing
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/my/listings/{id}/publish:
    post:
      summary: Make the listing searchable (draft or archived -> published)
      description: Blocked (403 trust_blocked) while the supplier trust band is red. Fails closed with 503 trust_unavailable when trust cannot be checked or is unknown.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/SupplierId"}
      responses:
        "200":
          description: Published listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/my/listings/{id}/unpublish:
    post:
      summary: Remove the listing from search (published -> archived)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/SupplierId"}
      responses:
        "200":
          description: Archived listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
components:
  parameters:
    SupplierId:
      name: X-Supplier-Id
      in: header
      required: true
      description: Set by the gateway from an admin-verified supplier claim (pattern ^sup_[A-Za-z0-9_.:-]{1,59}$); clients never send it.
      schema: {type: string}
  responses:
    Error:
      description: Error body
      content:
        application/json:
          schema: {$ref: ../schemas/common.schema.json#/$defs/Error}
  schemas:
    ListingWrite:
      type: object
      description: Unknown fields are ignored (supplier, source, status, id can not be set by the client). Text is stripped of control/bidi-override characters.
      required: [kind, title, category, price, unit, origin]
      properties:
        kind: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}
        condition: {$ref: ../schemas/common.schema.json#/$defs/Condition}
        title: {type: string, minLength: 3, maxLength: 140}
        title_ar: {type: string, minLength: 3, maxLength: 140}
        description: {type: string, maxLength: 4000}
        description_ar: {type: string, maxLength: 4000}
        category: {type: string, description: Leaf slug from /v1/categories that belongs to kind}
        price:
          type: object
          required: [min, max]
          description: Same currency on both ends, amounts > 0 (<= 6 decimals, <= 1e9), min <= max
          properties:
            min: {$ref: ../schemas/common.schema.json#/$defs/Money}
            max: {$ref: ../schemas/common.schema.json#/$defs/Money}
        unit: {type: string, minLength: 1, maxLength: 24}
        moq: {type: integer, minimum: 1, default: 1}
        incoterm: {$ref: ../schemas/common.schema.json#/$defs/Incoterm}
        unit_weight_kg: {type: number, exclusiveMinimum: 0, maximum: 1000000}
        unit_volume_m3: {type: number, exclusiveMinimum: 0, maximum: 100000}
        hs_code: {type: string, pattern: "^[0-9]{6,10}$"}
        lead_time_days: {$ref: ../schemas/common.schema.json#/$defs/DayRange}
        images: {type: array, maxItems: 8, items: {type: string, description: http(s) URL, maxLength: 2048}}
        origin: {$ref: ../schemas/common.schema.json#/$defs/Location}
        specs: {type: object, maxProperties: 20, additionalProperties: {type: string, maxLength: 200}}
    OwnedListing:
      allOf:
        - $ref: "#/components/schemas/ListingDetail"
        - type: object
          required: [status, created_at, updated_at]
          properties:
            status: {type: string, enum: [draft, published, archived]}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            published_at: {type: string, format: date-time}
    ListingDetail:
      allOf:
        - $ref: ../schemas/common.schema.json#/$defs/Listing
        - type: object
          properties:
            description: {type: string}
            description_ar: {type: string}
            specs: {type: object, additionalProperties: {type: string}}
    Supplier:
      allOf:
        - $ref: ../schemas/common.schema.json#/$defs/SupplierSummary
        - type: object
          properties:
            name_ar: {type: string}
            certifications: {type: array, items: {type: string}}
            listing_count: {type: integer}
            source: {type: string}
    CategoryNode:
      type: object
      required: [slug, name, name_ar, children]
      properties:
        slug: {type: string}
        name: {type: string}
        name_ar: {type: string}
        children:
          type: array
          items: {$ref: "#/components/schemas/CategoryNode"}
