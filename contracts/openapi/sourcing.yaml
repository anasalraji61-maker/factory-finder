openapi: 3.1.0
info:
  title: Factory Finder - sourcing
  version: 0.1.0
servers:
  - url: http://localhost:8101
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: sourcing}
                  version: {type: string}
  /ready:
    get:
      operationId: ready
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: sourcing}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: sourcing}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/search:
    get:
      operationId: getSearch
      summary: Search listings across enabled sources (Arabic or English query)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: kind, in: query, schema: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}}
        - {name: condition, in: query, schema: {type: string, enum: [new, used, refurbished, any], default: any}}
        - {name: origin_country, in: query, schema: {$ref: ../schemas/common.schema.json#/$defs/CountryCode}}
        - {name: category, in: query, description: Category or kind slug from /v1/categories, schema: {type: string}}
        - {name: min_price, in: query, description: Unit price floor in USD, schema: {type: number, minimum: 0}}
        - {name: max_price, in: query, description: Unit price cap in USD, schema: {type: number, minimum: 0}}
        - {name: moq_max, in: query, schema: {type: integer, minimum: 0}}
        - {name: verified_only, in: query, schema: {type: boolean, default: false}}
        - {name: sort, in: query, description: "Result order; ties always break by relevance score then id", schema: {type: string, enum: [relevance, price_asc, price_desc, trust, moq], default: relevance}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page of ranked results
          content:
            application/json:
              schema:
                example: {
                  "items": [
                    {
                      "id": "lst_0082",
                      "source": "mock",
                      "source_url": "https://example.com/mock/listings/lst_0082",
                      "kind": "production_line",
                      "condition": "used",
                      "title": "Used Nissei Injection Molding Machine 180 Ton (2011)",
                      "title_ar": "ماكينة حقن بلاستيك مستعملة Nissei 180 طن (2011)",
                      "category": "plastics_machinery",
                      "images": [
                        "https://picsum.photos/seed/lst_0082/600/600",
                        "https://picsum.photos/seed/lst_0082_2/600/600"
                      ],
                      "price": {
                        "min": {
                          "amount": "9500.00",
                          "currency": "USD"
                        },
                        "max": {
                          "amount": "16000.00",
                          "currency": "USD"
                        }
                      },
                      "unit": "set",
                      "moq": 1,
                      "incoterm": "FOB",
                      "unit_weight_kg": 6500.0,
                      "unit_volume_m3": 14.0,
                      "hs_code": "8477.10",
                      "lead_time_days": {
                        "min": 20,
                        "max": 35
                      },
                      "supplier": {
                        "id": "sup_jp_002",
                        "name": "Osaka Kikai Trading Co.",
                        "name_ar": "أوساكا كيكاي للماكينات المستعملة",
                        "location": {
                          "country_code": "JP",
                          "city": "Osaka",
                          "point": {
                            "lat": 34.69,
                            "lon": 135.5
                          }
                        },
                        "years_in_business": 29,
                        "verified": true,
                        "trust_score": 36,
                        "trust_band": "red"
                      },
                      "origin": {
                        "country_code": "JP",
                        "city": "Osaka",
                        "point": {
                          "lat": 34.69,
                          "lon": 135.5
                        }
                      }
                    }
                  ],
                  "total": 4,
                  "page": 1,
                  "page_size": 2,
                  "sources": [
                    {
                      "source": "mock",
                      "status": "ok",
                      "count": 4
                    },
                    {
                      "source": "native",
                      "status": "ok",
                      "count": 0
                    }
                  ],
                  "facets": {
                    "kind": [
                      {
                        "value": "production_line",
                        "count": 4
                      }
                    ],
                    "condition": [
                      {
                        "value": "used",
                        "count": 3
                      },
                      {
                        "value": "new",
                        "count": 1
                      }
                    ],
                    "origin_country": [
                      {
                        "value": "JP",
                        "count": 2
                      },
                      {
                        "value": "CN",
                        "count": 1
                      },
                      {
                        "value": "DE",
                        "count": 1
                      }
                    ],
                    "category": [
                      {
                        "value": "plastics_machinery",
                        "count": 4
                      }
                    ]
                  }
                }
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    required: [sources]
                    properties:
                      warning: {type: [string, "null"], description: "Optional; set (e.g. partial_results: ...) when any source failed/timed out or mock results were substituted, so the page may be incomplete. Per-source detail stays in sources[]."}
                      facets:
                        type: object
                        description: Counts over the full matched set (all pages), each list ordered by count desc then value
                        properties:
                          kind: &facet {type: array, items: {type: object, required: [value, count], properties: {value: {type: string}, count: {type: integer}}}}
                          condition: *facet
                          origin_country: *facet
                          category: *facet
                      items:
                        type: array
                        items: {$ref: ../schemas/common.schema.json#/$defs/Listing}
                      sources:
                        type: array
                        items:
                          type: object
                          required: [source, status, count]
                          properties:
                            source: {type: string}
                            status: {type: string, enum: [ok, timeout, error]}
                            count: {type: integer}
                            warning: {type: [string, "null"], description: "Optional; set when a real source failed and mock results were used instead"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/listings/{id}:
    get:
      operationId: getListingsById
      summary: Listing detail
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Listing with description and specs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ListingDetail"}
        "404":
          description: Definite absence (every source answered not found, or the listing is delisted/hidden/pending review). Code `listing_not_found`.
          content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}
        "503":
          description: No source returned the listing and at least one failed/timed out, so absence is unknown (code `upstream_timeout`). Retry; do not treat as delisted.
          content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}
  /v1/listings/{id}/price-history:
    get:
      operationId: getListingsByIdPriceHistory
      summary: Price history of a listing (headline min unit price) with min/max/avg and trend
      description: >
        Observations are recorded (best effort) whenever a non-mock listing is fetched in search/detail or a native
        listing is published/updated; identical price within 6 h is not re-recorded and each listing keeps a bounded
        number of points. Mock-catalog listings return a deterministic seeded series (`synthetic: true`) so apps can draw
        charts. `trend.insufficient_data` is true with fewer than 2 observations or 2 buckets (then `change_pct` is absent).
        `hints` (absent when insufficient) feeds watchlist/alert target suggestions.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 90}}
        - {name: bucket, in: query, schema: {type: string, enum: [day, week, month], default: day}}
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceHistory"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/listings/{id}/similar:
    get:
      operationId: getListingsByIdSimilar
      summary: Similar listings (same kind, category/title/spec overlap, price band, trust-aware)
      description: Deterministic and bounded (at most 300 candidates scored, trust looked up for the best 60). Different suppliers rank above the same supplier; red-band suppliers are demoted. Every item carries bilingual reason codes.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 30, default: 10}}
      responses:
        "200":
          description: Ranked similar listings
          content:
            application/json:
              schema:
                type: object
                required: [listing_id, items, total]
                properties:
                  listing_id: {type: string}
                  items: {type: array, items: {$ref: "#/components/schemas/Recommended"}}
                  total: {type: integer}
                  warning: {type: string, nullable: true, description: "Set (e.g. partial_results: ...) when the time budget ran out"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/recommendations:
    get:
      operationId: listRecommendations
      summary: Recommendations from recently viewed listing ids (stateless, no user tracking)
      description: >
        The client sends its own recent listing ids (`ref`, most recent first, max 20; unknown ids are ignored). Nothing is
        stored or linked to a user. With no usable ref, returns top trusted listings. At most 3 results per supplier.
        `country` is an optional preferred origin country (small boost, never a filter).
      parameters:
        - {name: ref, in: query, schema: {type: string, maxLength: 1500}, description: "Comma-separated listing ids (max 20)"}
        - {name: country, in: query, schema: {type: string, minLength: 2, maxLength: 2}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200":
          description: Ranked listings with reasons
          content:
            application/json:
              schema:
                type: object
                required: [items, total, based_on]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Recommended"}}
                  total: {type: integer}
                  based_on: {type: array, items: {type: string}, description: "Reference ids that resolved to listings"}
                  warning: {type: string, nullable: true, description: "Set (e.g. partial_results: ...) when the time budget ran out"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/suppliers/{id}:
    get:
      operationId: getSuppliersById
      summary: Supplier profile (with trust band)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/categories:
    get:
      operationId: listCategories
      summary: Bilingual category tree (top level = listing kinds)
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CategoryNode"}
  /v1/sources:
    get:
      operationId: listSources
      summary: Registered sources, enabled flag, health and compliance note
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, mode, enabled, configured, status, compliance]
                  properties:
                    id: {type: string}
                    name: {type: string}
                    mode: {type: string, enum: [mock, official_api, licensed_feed, native]}
                    enabled: {type: boolean}
                    configured: {type: boolean}
                    status: {type: string, enum: [ok, error, timeout, disabled]}
                    compliance: {type: string}
  /v1/my/listings:
    post:
      operationId: createMyListings
      summary: Create a listing owned by the calling (verified) supplier; starts as draft
      description: |
        Identity is the gateway-set X-Supplier-Id (only forwarded for an admin-verified claim); it is never read from the
        body (supplier/source/status/id fields in the body are ignored). 403 supplier_required without it; when
        FF_INTERNAL_TOKEN is configured, calls lacking a valid X-Internal-Token get 401. At most 200 listings per
        supplier (409 listing_cap_reached) and 30 creates per hour (429 rate_limited + Retry-After).
      parameters:
        - {$ref: "#/components/parameters/SupplierId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ListingWrite"}
      responses:
        "201":
          description: Created (status draft, id nat_xxxxxxxx)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    get:
      operationId: listMyListings
      summary: List the caller's own listings (all statuses), newest first
      parameters:
        - {$ref: "#/components/parameters/SupplierId"}
        - {name: status, in: query, schema: {type: string, enum: [draft, published, archived, pending_review, hidden]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/OwnedListing"}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/my/listings/import:
    post:
      operationId: createMyListingsImport
      summary: Bulk create/update the caller's listings (max 100 per call), idempotent by external_ref
      description: |
        Same identity/authz rules as POST /v1/my/listings (gateway-set X-Supplier-Id; 403 supplier_required, 401 bad
        internal token). Each item is a ListingWrite plus a required `external_ref` (the supplier's own stable id,
        unique per supplier). An item whose external_ref already exists for this supplier UPDATES that listing (status
        unchanged unless moderation applies); otherwise a draft is CREATED. Items are validated independently: bad items
        are `rejected` with a reason and never fail the whole call (the call itself is 422 only for an empty list or
        more than 100 items). The same automatic moderation screening as single create/update applies per item
        (flagged items become pending_review; `moderation` carries the owner-facing reason). The per-supplier cap of
        200 listings is enforced across the batch (creates beyond it are rejected `listing_cap_reached`; updates still
        apply). With dry_run=true nothing is written and no import quota is consumed; results show what would happen.
        Results only ever contain ids of the caller's own listings. At most 10 non-dry-run imports per hour per
        supplier (429 rate_limited + Retry-After).
      parameters:
        - {$ref: "#/components/parameters/SupplierId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ListingImportRequest"}
      responses:
        "200":
          description: Per-item results in request order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ListingImportResponse"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/my/listings/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {$ref: "#/components/parameters/SupplierId"}
    get:
      operationId: getMyListingsById
      summary: One of the caller's listings (404 for anyone else's)
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      operationId: updateMyListingsById
      summary: Replace the listing's content (status is unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ListingWrite"}
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteMyListingsById
      summary: Permanently delete the listing
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/my/listings/{id}/publish:
    post:
      operationId: createMyListingsByIdPublish
      summary: Make the listing searchable (draft or archived -> published)
      description: Blocked (403 trust_blocked) while the supplier trust band is red. Fails closed with 503 trust_unavailable when trust cannot be checked or is unknown.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/SupplierId"}
      responses:
        "200":
          description: Published listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/my/listings/{id}/unpublish:
    post:
      operationId: createMyListingsByIdUnpublish
      summary: Remove the listing from search (published -> archived)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/SupplierId"}
      responses:
        "200":
          description: Archived listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnedListing"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/listings/{id}/report:
    post:
      operationId: createListingsByIdReport
      summary: Report a published listing (signed-in user)
      description: |
        Reporter identity is the gateway-set X-User-Id (401 without it). Only published listings can be reported
        (404 otherwise, so hidden/draft ids are not revealed). One report per reporter+listing: repeats answer exactly
        like the first (202). At most 10 reports per hour per reporter (429 + Retry-After). Reporting your own listing
        (X-Supplier-Id matches) is 409 own_listing. Free-text details are capped at 500 chars and emails/links/phone
        numbers are redacted. Reporter identity is stored only as a keyed hash and never returned to the owner.
        Enough distinct open reports (default 3) move the listing to pending_review.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: X-User-Id, in: header, required: true, description: Set by the gateway, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, enum: [prohibited_item, counterfeit, scam_or_fraud, misleading, contact_info_in_listing, offensive, other]}
                details: {type: string, maxLength: 500}
      responses:
        "202":
          description: Report received
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [received]}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/listings/{id}/events:
    post:
      operationId: createListingsByIdEvents
      summary: Record an anonymous listing event (view, contact click, share) for supplier analytics
      description: |
        Privacy-safe: only daily aggregate counters per listing and type are stored (`listing_stats_daily`); no IP,
        user id or per-viewer row is persisted. The viewer (X-User-Id when signed in, else X-Client-Ip, both set by the
        gateway) exists only as a transient HMAC keyed by a secret and the UTC day, held in bounded memory: the same
        viewer counts at most once per listing+type per 30 minutes (`counted: false` for repeats) and feeds a
        size-capped unique-viewer estimate. At most 60 events per minute per client IP and per user (429 + Retry-After).
        Ids that are not published native listings answer the same 202 with `counted: false` (nothing is revealed).
        With FF_INTERNAL_TOKEN configured the call needs X-Internal-Token (401 otherwise). Search impressions and
        report counts are recorded server side; watchlist adds only through the internal `Analytics.bump` hook.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: X-User-Id, in: header, required: false, description: Set by the gateway (signed-in viewers only), schema: {type: string}}
        - {name: X-Client-Ip, in: header, required: false, description: Set by the gateway; used only for the transient daily-salted hash, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: {type: string, enum: [view, contact_click, share]}
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [counted]
                properties:
                  counted: {type: boolean, description: "false when deduplicated or the listing is not countable"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/my/analytics:
    get:
      operationId: listMyAnalytics
      summary: Analytics for the verified supplier's own listings
      description: |
        Identity is the gateway-set X-Supplier-Id (403 supplier_required without it); only the caller's own listings
        are counted (`listing_id` of someone else's or an unknown listing is 404). Periods end today (UTC, inclusive);
        `previous_*` covers the equally long period before. `unique_viewers` sums per-day estimates (a person on two
        days counts twice; the estimate saturates when the in-memory cap is hit). Conversions are capped at 1.
        `change_pct` is null when the previous value is 0. The per-listing table is top 20 by views.
        Counters are kept 400 days and deleted with the listing or the account.
      parameters:
        - {$ref: "#/components/parameters/SupplierId"}
        - {name: days, in: query, schema: {type: integer, enum: [7, 30, 90], default: 30}}
        - {name: listing_id, in: query, schema: {type: string, maxLength: 64}}
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupplierAnalytics"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/admin/moderation/reports:
    get:
      operationId: listAdminModerationReports
      summary: List user reports (admin)
      description: Requires X-Admin-Token (404 while FF_SOURCING_ADMIN_TOKEN is unset, 401 when wrong). Reporter is an opaque hash prefix, never a user id.
      parameters:
        - {$ref: "#/components/parameters/AdminToken"}
        - {name: status, in: query, schema: {type: string, enum: [open, actioned, dismissed, all], default: open}}
        - {name: listing_id, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page of reports (id, listing_id, reason, details, status, reporter_ref, created_at, resolved_at, listing{title,status,supplier_id})
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/moderation/listings:
    get:
      operationId: listAdminModerationListings
      summary: List listings that are pending_review or hidden (admin)
      parameters:
        - {$ref: "#/components/parameters/AdminToken"}
        - {name: status, in: query, schema: {type: string, enum: [pending_review, hidden, all], default: all}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page (id, title, supplier_id, status, moderation_source, moderation_reason, moderated_at, open_reports)
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/admin/moderation/listings/{id}/hide:
    post:
      operationId: createAdminModerationListingsByIdHide
      summary: Hide a listing (admin); open reports become actioned
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/AdminToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 300, description: Shown to the owner}
      responses:
        "200":
          description: Moderation state
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/admin/moderation/listings/{id}/restore:
    post:
      operationId: createAdminModerationListingsByIdRestore
      summary: Restore a hidden/pending_review listing to its previous status (admin); open reports become dismissed
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/AdminToken"}
      responses:
        "200":
          description: Moderation state
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
        - {name: X-Supplier-Id, in: header, required: false, schema: {type: string}, description: "The user's verified supplier id (gateway-set). Sourcing is keyed by supplier, so without it only the user's listing reports are in scope."}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: sourcing}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
        - {name: X-Supplier-Id, in: header, required: false, schema: {type: string}, description: "The user's verified supplier id (gateway-set). Sourcing is keyed by supplier, so without it only the user's listing reports are in scope."}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: sourcing}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller}
components:
  parameters:
    AdminToken:
      name: X-Admin-Token
      in: header
      required: true
      schema: {type: string}
    SupplierId:
      name: X-Supplier-Id
      in: header
      required: true
      description: Set by the gateway from an admin-verified supplier claim (pattern ^sup_[A-Za-z0-9_.:-]{1,59}$); clients never send it.
      schema: {type: string}
  responses:
    Error:
      description: Error body
      content:
        application/json:
          schema: {$ref: ../schemas/common.schema.json#/$defs/Error}
  schemas:
    AnalyticsCounts:
      type: object
      required: [impression, view, contact_click, share, watchlist_add, report]
      properties:
        impression: {type: integer, minimum: 0, description: Appearances on served search pages}
        view: {type: integer, minimum: 0}
        contact_click: {type: integer, minimum: 0}
        share: {type: integer, minimum: 0}
        watchlist_add: {type: integer, minimum: 0}
        report: {type: integer, minimum: 0}
    SupplierAnalytics:
      type: object
      required: [period, totals, unique_viewers, previous_totals, change_pct, conversion, series, listings, listings_total]
      properties:
        period:
          type: object
          required: [days, from, to, previous_from, previous_to]
          properties:
            days: {type: integer, enum: [7, 30, 90]}
            from: {type: string, format: date}
            to: {type: string, format: date}
            previous_from: {type: string, format: date}
            previous_to: {type: string, format: date}
        totals: {$ref: "#/components/schemas/AnalyticsCounts"}
        unique_viewers:
          type: object
          required: [view, contact_click, note]
          properties:
            view: {type: integer, minimum: 0}
            contact_click: {type: integer, minimum: 0}
            note: {type: string}
        previous_totals: {$ref: "#/components/schemas/AnalyticsCounts"}
        change_pct:
          type: object
          description: Period-over-period change in percent per metric; null when the previous value is 0
          additionalProperties: {type: [number, "null"]}
        conversion:
          type: object
          required: [view_to_contact, impression_to_view, previous_view_to_contact]
          properties:
            view_to_contact: {type: [number, "null"], minimum: 0, maximum: 1}
            impression_to_view: {type: [number, "null"], minimum: 0, maximum: 1}
            previous_view_to_contact: {type: [number, "null"], minimum: 0, maximum: 1}
        series:
          type: array
          description: One entry per day of the period, zero filled, oldest first
          items:
            allOf:
              - $ref: "#/components/schemas/AnalyticsCounts"
              - type: object
                required: [date]
                properties:
                  date: {type: string, format: date}
        listings:
          type: array
          description: Top 20 listings by views (only those with activity in the period)
          items:
            allOf:
              - $ref: "#/components/schemas/AnalyticsCounts"
              - type: object
                required: [listing_id, title, status, view_to_contact]
                properties:
                  listing_id: {type: string}
                  title: {type: string}
                  status: {type: string}
                  view_to_contact: {type: [number, "null"], minimum: 0, maximum: 1}
        listings_total: {type: integer, minimum: 0, description: Listings with activity in the period (before the top-20 cut)}
    ListingWrite:
      type: object
      description: Unknown fields are ignored (supplier, source, status, id can not be set by the client). Text is stripped of control/bidi-override characters.
      required: [kind, title, category, price, unit, origin]
      properties:
        kind: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}
        condition: {$ref: ../schemas/common.schema.json#/$defs/Condition}
        title: {type: string, minLength: 3, maxLength: 140}
        title_ar: {type: string, minLength: 3, maxLength: 140}
        description: {type: string, maxLength: 4000}
        description_ar: {type: string, maxLength: 4000}
        category: {type: string, description: Leaf slug from /v1/categories that belongs to kind}
        price:
          type: object
          required: [min, max]
          description: Same currency on both ends, amounts > 0 (<= 6 decimals, <= 1e9), min <= max
          properties:
            min: {$ref: ../schemas/common.schema.json#/$defs/Money}
            max: {$ref: ../schemas/common.schema.json#/$defs/Money}
        unit: {type: string, minLength: 1, maxLength: 24}
        moq: {type: integer, minimum: 1, default: 1}
        incoterm: {$ref: ../schemas/common.schema.json#/$defs/Incoterm}
        unit_weight_kg: {type: number, exclusiveMinimum: 0, maximum: 1000000}
        unit_volume_m3: {type: number, exclusiveMinimum: 0, maximum: 100000}
        hs_code: {type: string, pattern: "^[0-9]{6,10}$"}
        lead_time_days: {$ref: ../schemas/common.schema.json#/$defs/DayRange}
        images: {type: array, maxItems: 8, items: {type: string, description: http(s) URL, maxLength: 2048}}
        origin: {$ref: ../schemas/common.schema.json#/$defs/Location}
        specs: {type: object, maxProperties: 20, additionalProperties: {type: string, maxLength: 200}}
    ListingImportItem:
      allOf:
        - $ref: "#/components/schemas/ListingWrite"
        - type: object
          required: [external_ref]
          properties:
            external_ref: {type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:\\-/]{0,63}$", description: Supplier's own stable reference; idempotency key together with the supplier}
    ListingImportRequest:
      type: object
      required: [items]
      properties:
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: "#/components/schemas/ListingImportItem"}}
        dry_run: {type: boolean, default: false}
    ListingImportResult:
      type: object
      required: [index, action]
      properties:
        index: {type: integer, minimum: 0}
        external_ref: {type: string}
        action: {type: string, enum: [created, updated, rejected]}
        id: {type: string, description: "Caller's own listing id (created/updated, non-dry-run created only after write; absent for rejected and for dry-run creates)"}
        status: {type: string, enum: [draft, published, archived, pending_review, hidden], description: Listing status after the write (not present on dry_run)}
        moderation: {type: string, description: Owner-facing automatic screening reason when the item was flagged}
        reason: {type: string, enum: [validation_error, invalid_item, duplicate_in_batch, listing_cap_reached, conflict], description: Only on rejected}
        message: {type: string, description: Only on rejected; never echoes submitted content beyond field paths}
    ListingImportResponse:
      type: object
      required: [dry_run, created, updated, rejected, results]
      properties:
        dry_run: {type: boolean}
        created: {type: integer}
        updated: {type: integer}
        rejected: {type: integer}
        results: {type: array, items: {$ref: "#/components/schemas/ListingImportResult"}}
    OwnedListing:
      allOf:
        - $ref: "#/components/schemas/ListingDetail"
        - type: object
          required: [status, created_at, updated_at]
          properties:
            external_ref: {type: string, description: Supplier's own reference when set via bulk import}
            status: {type: string, enum: [draft, published, archived, pending_review, hidden], description: "pending_review/hidden = moderated: not searchable, not visible to anyone but the owner"}
            moderation_source: {type: string, enum: [auto, report, admin]}
            moderation_reason: {type: string, description: Why the listing is pending_review/hidden; never contains reporter data}
            moderated_at: {type: string, format: date-time}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            published_at: {type: string, format: date-time}
    Recommended:
      type: object
      required: [listing, score, reasons]
      properties:
        listing: {$ref: ../schemas/common.schema.json#/$defs/Listing}
        score: {type: number, minimum: 0, maximum: 1}
        reasons:
          type: array
          items:
            type: object
            required: [code, en, ar]
            properties:
              code:
                type: string
                description: same_category | similar_title | shared_specs | similar_price | same_condition | different_supplier | same_supplier | trusted_supplier | verified_supplier | origin_country_match | because_viewed | top_trusted
              en: {type: string}
              ar: {type: string}
              ref_listing_id: {type: string, description: "For because_viewed: the viewed listing this follows"}
    PriceHistory:
      type: object
      required: [listing_id, currency, days, bucket, synthetic, points, trend]
      properties:
        listing_id: {type: string}
        currency: {type: string}
        unit: {type: string}
        days: {type: integer}
        bucket: {type: string, enum: [day, week, month]}
        synthetic: {type: boolean, description: "true = deterministic mock history"}
        points:
          type: array
          items:
            type: object
            required: [t, avg, min, max, n]
            properties:
              t: {type: string, format: date-time, description: "Bucket start (UTC)"}
              avg: {type: string, description: "Decimal string"}
              min: {type: string}
              max: {type: string}
              n: {type: integer}
        summary:
          type: object
          required: [min, max, avg, current, first, observations]
          properties:
            min: {type: string}
            max: {type: string}
            avg: {type: string}
            current: {type: string}
            first: {type: string}
            observations: {type: integer}
        trend:
          type: object
          required: [direction, insufficient_data]
          properties:
            direction: {type: string, enum: [up, down, flat]}
            change_pct: {type: string, description: "Decimal string, first to latest observation in the window; flat = within +-1%"}
            insufficient_data: {type: boolean}
        hints:
          type: object
          required: [at_period_low, at_period_high, current_vs_min_pct, suggested_target]
          properties:
            at_period_low: {type: boolean}
            at_period_high: {type: boolean}
            current_vs_min_pct: {type: string}
            suggested_target: {$ref: ../schemas/common.schema.json#/$defs/Money}
    ListingDetail:
      allOf:
        - $ref: ../schemas/common.schema.json#/$defs/Listing
        - type: object
          properties:
            description: {type: string}
            description_ar: {type: string}
            specs: {type: object, additionalProperties: {type: string}}
    Supplier:
      allOf:
        - $ref: ../schemas/common.schema.json#/$defs/SupplierSummary
        - type: object
          properties:
            name_ar: {type: string}
            certifications: {type: array, items: {type: string}}
            listing_count: {type: integer}
            source: {type: string}
    CategoryNode:
      type: object
      required: [slug, name, name_ar, children]
      properties:
        slug: {type: string}
        name: {type: string}
        name_ar: {type: string}
        children:
          type: array
          items: {$ref: "#/components/schemas/CategoryNode"}
