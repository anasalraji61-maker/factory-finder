openapi: 3.1.0
info:
  title: Factory Finder payments
  version: 0.1.0
  description: |
    Platform commission and deal payments (ROADMAP Phase 6 prep), crypto first. Invoices, payment attempts, an
    append-only double-entry ledger and provider webhooks. Money is always a decimal STRING plus currency, never a number.
    User routes need X-User-Id (401 otherwise); an invoice is visible only to its payer, its payee and admins (other
    callers get 404, never 403, so ids cannot be probed). Admin = header X-Admin-Token equal to FF_PAYMENTS_ADMIN_TOKEN
    (the gateway never forwards it; admin is disabled when the variable is unset). Webhooks are authenticated only by an
    HMAC-SHA256 signature (X-FF-Signature: t=<unix>,v1=<hex(hmac(secret, "<t>.<raw body>"))>), 5 minute tolerance,
    replay-protected by event_id. Providers: mock | usdt_tron (UNVERIFIED against a live chain) | off (FF_PAYMENTS_PROVIDER).
    Not a licensed payment institution: see the service README (compliance note).
servers: [{url: http://localhost:8111}]
paths:
  /health:
    get: {summary: "Liveness", operationId: health, responses: {"200": {description: ok}}}
  /ready:
    get:
      operationId: ready
      summary: Readiness (database reachable)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: payments}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: payments}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/invoices:
    post:
      summary: "Create invoices"
      operationId: createInvoice
      description: |
        Deal owner (the buyer of an rfq deal): send deal_id + kind only; payer, payee and amount are derived from the deal
        (commission = the deal's commission, deal_payment = its subtotal). Overrides (payer_user_id, payee, amount,
        commission_basis, expires_in_minutes) are admin only (403 admin_required). Idempotent: an open or paid invoice of the same
        deal and kind is returned again with 200.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InvoiceCreate"}}}}
      responses:
        "200": {description: Existing invoice, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    get:
      summary: "Get invoices"
      operationId: listInvoices
      description: Caller's invoices (payer or payee); admins see all. Filter by deal_id.
      parameters:
        - {name: deal_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/InvoiceStatus"}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/InvoicePage"}}}}
        "422": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/invoices/{id}:
    get:
      summary: "Get invoices by id"
      operationId: getInvoice
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Invoice, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/invoices/{id}/cancel:
    post:
      summary: "Create invoices by id cancel"
      operationId: cancelInvoice
      description: Payer or admin. Only pending / awaiting_payment invoices (status becomes failed, status_reason cancelled). 409 when the invoice is in another state, or 409 `concurrent_update` if it changed concurrently (retry). Creating an invoice can also return 409 `concurrent_update` (retry). X-User-Id longer than 64 chars is 401.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Cancelled, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/invoices/{id}/refund:
    post:
      summary: "Create invoices by id refund"
      operationId: refundInvoice
      description: Admin only. Only paid invoices; appends a reversing ledger group. The actual crypto transfer back is manual.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Refunded, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/ledger:
    get:
      summary: "Get ledger"
      operationId: listLedger
      description: Admin only. Immutable ledger legs of an invoice (debits and credits balance per group_id).
      parameters:
        - {name: invoice_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Entries, content: {application/json: {schema: {$ref: "#/components/schemas/LedgerPage"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/ledger/deals/{deal_id}/commission:
    get:
      summary: "Get ledger deals by deal id commission"
      operationId: dealCommission
      description: Admin only. Platform commission booked for a deal (revenue:commission credits minus refund reversals), per currency, exact decimal strings.
      parameters: [{name: deal_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: Totals
          content: {application/json: {schema: {type: object, required: [deal_id, items], properties: {deal_id: {type: string}, items: {type: array, items: {type: object, required: [currency, earned, refunded, net], properties: {currency: {type: string}, earned: {type: string}, refunded: {type: string}, net: {type: string}}}}}}}}
        "403": {$ref: "#/components/responses/Error"}
  /v1/payments/review:
    get:
      summary: "Get payments review"
      operationId: listPaymentReview
      description: Admin only. Invoices that need a human, oldest first - money arrived after expiry / cancel (`late_payment_review`) or with the wrong amount (`amount_mismatch_review`). Refund or settle manually; sweep also scans invoices expired in the last 7 days for late transfers.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/InvoicePage"}}}}
        "403": {$ref: "#/components/responses/Error"}
  /v1/payments/review/{invoice_id}/resolve:
    post:
      summary: "Resolve a payments review item"
      operationId: resolvePaymentReview
      description: |
        Admin only (X-Admin-Token). Resolves one invoice of GET /v1/payments/review (status_reason `late_payment_review` /
        `amount_mismatch_review`). `X-Reviewer` (optional, charset [A-Za-z0-9_.:-], max 64, default `admin`) is stored in
        the audit row. Compare-and-set on the review reason: only one reviewer can resolve; the invoice then leaves the queue.
        * `settle` - money accepted: the invoice becomes `paid` (ledger legs + rfq outbox event exactly like a normal settlement,
          even if it had expired / failed), `status_reason` = `review_settled`.
        * `refund_flag` - money must go back to the payer (done off-platform): status unchanged, `status_reason` = `refund_flagged`.
        * `dismiss` - nothing to do: status unchanged, `status_reason` = `review_dismissed`.
        An `amount_mismatch_review` invoice can only be settled with a non-empty `note`, `confirm_amount_mismatch: true` and
        `received_amount` (same currency as the expected amount) within FF_PAYMENTS_REVIEW_AMOUNT_TOLERANCE (default 0.02 of the
        expected amount; 0 = exact only); otherwise 422 `note_required` / `amount_mismatch_confirmation_required` /
        `received_amount_required` / `amount_outside_tolerance`.
        Idempotent: repeating the same action on an already resolved invoice returns the stored resolution (200, nothing is booked
        twice); a different action answers 409 `already_resolved`. 409 `not_in_review` when the invoice was never flagged,
        409 `settlement_conflict` when a unique index refuses the settlement, 404 `invoice_not_found`.
      parameters: [{name: invoice_id, in: path, required: true, schema: {type: string}}, {name: X-Reviewer, in: header, required: false, schema: {type: string, maxLength: 64}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReviewResolveRequest"}}}
      responses:
        "200": {description: Resolution (audit row), content: {application/json: {schema: {$ref: "#/components/schemas/ReviewResolution"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/payments/sweep:
    post:
      summary: "Create payments sweep"
      operationId: sweepPayments
      description: |
        Admin / scheduler only. Expires overdue invoices, polls the provider for awaiting / confirming ones and drains the
        rfq callback outbox (due events only; see /v1/payments/outbox).
      responses:
        "200":
          description: Report
          content: {application/json: {schema: {type: object, properties: {expired: {type: integer}, late_flagged: {type: integer}, polled: {type: integer}, updated: {type: integer}, outbox_delivered: {type: integer}, outbox_retry: {type: integer}, outbox_dead: {type: integer}}}}}
        "403": {$ref: "#/components/responses/Error"}
  /v1/payments/outbox:
    get:
      summary: "Get payments outbox"
      operationId: listOutbox
      description: |
        Admin only. Settlement events owed to rfq (POST /v1/internal/deals/{id}/payment-status), written in the same
        transaction as the paid / refunded transition. Delivery: idempotent by event_id, per-deal order kept, exponential
        backoff (30 s doubling, max 1 h), `dead` after 8 attempts or a permanent rfq refusal (4xx).
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, delivered, dead]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: Page
          content: {application/json: {schema: {type: object, required: [items, total], properties: {total: {type: integer}, page: {type: integer}, page_size: {type: integer}, items: {type: array, items: {$ref: "#/components/schemas/OutboxEvent"}}}}}}
        "403": {$ref: "#/components/responses/Error"}
  /v1/payments/outbox/{id}/requeue:
    post:
      summary: "Create payments outbox by id requeue"
      operationId: requeueOutbox
      description: Admin only. Puts a dead-lettered event back to pending (attempts reset). 409 `not_dead` otherwise, 404 unknown.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Requeued, content: {application/json: {schema: {$ref: "#/components/schemas/OutboxEvent"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/payments/webhooks/{provider}:
    post:
      summary: "Create payments webhooks by provider"
      operationId: receiveWebhook
      description: |
        Signed provider event (no X-User-Id). Body: {event_id, type: payment.confirming|payment.confirmed|payment.failed|payment.expired,
        invoice_id or provider_ref, tx_ref?, confirmations?, amount?}. Idempotent: a repeated event_id answers 200 duplicate and changes
        nothing; an event that no longer fits the status machine is acknowledged as ignored. Money for an expired / cancelled invoice, or a `paid` event with the wrong amount, answers `review`: the invoice keeps its status, status_reason becomes `late_payment_review` / `amount_mismatch_review` and it is listed by GET /v1/payments/review (never auto-settled, never silently dropped).
      parameters: [{name: provider, in: path, required: true, schema: {type: string, enum: [mock, usdt_tron]}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WebhookEvent"}}}}
      responses:
        "200":
          description: Accepted
          content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [applied, duplicate, ignored, review]}, invoice_id: {type: [string, "null"]}, invoice_status: {type: [string, "null"]}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: payments}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller, content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: payments}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller, content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
components:
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}
  schemas:
    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$', description: "decimal string, > 0; fiat at most 2 decimals, USDT at most 6"}
        currency: {type: string, pattern: '^[A-Z]{3,5}$'}
    InvoiceKind: {type: string, enum: [commission, deal_payment]}
    InvoiceStatus: {type: string, enum: [pending, awaiting_payment, confirming, paid, expired, failed, refunded]}
    InvoiceCreate:
      example: {
        "deal_id": "deal_a8011169d3ad4111b7b26b0f3e1782c2",
        "kind": "commission"
      }
      type: object
      required: [deal_id, kind]
      additionalProperties: false
      properties:
        deal_id: {type: string}
        kind: {$ref: "#/components/schemas/InvoiceKind"}
        memo: {type: [string, "null"], maxLength: 200}
        payer_user_id: {type: [string, "null"], description: admin only}
        payee: {type: [string, "null"], description: "admin only; 'platform' for commission, else the supplier user id"}
        amount: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}], description: admin only}
        commission_basis:
          type: [object, "null"]
          description: admin only; computes the commission (product 3%, raw_material 2%, production_line 4%, min 25 USD, half-up cents) when amount is omitted
          required: [subtotal, listing_kind]
          properties: {subtotal: {$ref: "#/components/schemas/Money"}, listing_kind: {type: string, enum: [product, raw_material, production_line]}}
        expires_in_minutes: {type: [integer, "null"], minimum: 1, maximum: 10080, description: admin only}
    OutboxEvent:
      type: object
      required: [id, event_id, deal_id, status, attempts, payload]
      properties:
        id: {type: string}
        event_id: {type: string, description: "<invoice_id>:<paid|refunded>"}
        deal_id: {type: string}
        status: {type: string, enum: [pending, delivered, dead]}
        attempts: {type: integer}
        next_attempt_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        payload: {type: object}
        created_at: {type: string, format: date-time}
        delivered_at: {type: [string, "null"], format: date-time}
    Invoice:
      example: {
        "id": "inv_48453497e5d541249f38",
        "deal_id": "deal_a8011169d3ad4111b7b26b0f3e1782c2",
        "payer_user_id": "eb4ad84e-14a5-4681-bcb2-91db2490c1db",
        "payee": "platform",
        "kind": "commission",
        "amount": {
          "amount": "112.50",
          "currency": "USD"
        },
        "status": "awaiting_payment",
        "status_reason": null,
        "expires_at": "2026-10-15T18:46:25.223455Z",
        "provider": "mock",
        "provider_ref": "mock_inv_48453497e5d541249f38",
        "pay_address": "mock-address-inv_48453497e5d541249f38",
        "pay_url": "https://pay.invalid/mock/inv_48453497e5d541249f38",
        "pay_amount": {
          "amount": "112.50",
          "currency": "USD"
        },
        "memo": "FF-REAGWDXDOU",
        "user_memo": null,
        "tx_ref": null,
        "confirmations": 0,
        "paid_at": null,
        "created_at": "2026-10-15T17:46:25.223455Z",
        "updated_at": "2026-10-15T17:46:25.300537Z"
      }
      type: object
      required: [id, deal_id, payer_user_id, payee, kind, amount, status, expires_at, provider, created_at, updated_at]
      properties:
        id: {type: string}
        deal_id: {type: string}
        payer_user_id: {type: string}
        payee: {type: string}
        kind: {$ref: "#/components/schemas/InvoiceKind"}
        amount: {$ref: "#/components/schemas/Money"}
        status: {$ref: "#/components/schemas/InvoiceStatus"}
        status_reason: {type: [string, "null"]}
        expires_at: {type: string, format: date-time}
        provider: {type: string}
        provider_ref: {type: [string, "null"]}
        pay_address: {type: [string, "null"], description: public receiving address only}
        pay_url: {type: [string, "null"]}
        pay_amount: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}], description: exact amount to send (USDT adds a unique sub-cent suffix used for matching)}
        memo: {type: string, description: unique reference the payer should quote}
        tx_ref: {type: [string, "null"]}
        confirmations: {type: integer}
        paid_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReviewResolveRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [settle, refund_flag, dismiss]}
        note: {type: [string, "null"], maxLength: 500, description: "Trimmed; no control characters. Required to settle an amount_mismatch_review."}
        confirm_amount_mismatch: {type: boolean, default: false, description: "Must be true to settle an amount_mismatch_review."}
        received_amount: {$ref: "#/components/schemas/Money", description: "Amount that actually arrived; required to settle an amount_mismatch_review (within tolerance)."}
      example: {action: settle, note: "Customer short-paid bank fees, verified on statement", confirm_amount_mismatch: true, received_amount: {amount: "374.00", currency: USD}}
    ReviewResolution:
      type: object
      required: [id, invoice_id, action, reviewer, previous_reason, invoice_status, status_reason, confirm_amount_mismatch, created_at]
      properties:
        id: {type: string}
        invoice_id: {type: string}
        action: {type: string, enum: [settle, refund_flag, dismiss]}
        note: {type: [string, "null"]}
        reviewer: {type: string}
        previous_reason: {type: string, enum: [late_payment_review, amount_mismatch_review]}
        invoice_status: {type: string, description: "Invoice status after the resolution (paid for settle)."}
        status_reason: {type: string, enum: [review_settled, refund_flagged, review_dismissed]}
        confirm_amount_mismatch: {type: boolean}
        received_amount: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        created_at: {type: string, format: date-time}
      example: {id: rvw_0b1c2d3e4f5a6b7c8d9e, invoice_id: inv_48453497e5d541249f38, action: dismiss, note: "Not ours", reviewer: alice, previous_reason: late_payment_review, invoice_status: expired, status_reason: review_dismissed, confirm_amount_mismatch: false, received_amount: null, created_at: "2026-10-16T10:00:00Z"}
    InvoicePage:
      type: object
      required: [items, total, page, page_size]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Invoice"}}, total: {type: integer}, page: {type: integer}, page_size: {type: integer}}
    LedgerEntry:
      type: object
      required: [id, group_id, invoice_id, account, direction, amount, created_at]
      properties:
        id: {type: string}
        group_id: {type: string}
        invoice_id: {type: string}
        account: {type: string}
        direction: {type: string, enum: [debit, credit]}
        amount: {$ref: "#/components/schemas/Money"}
        reason: {type: string, enum: [payment, refund]}
        created_at: {type: string, format: date-time}
    LedgerPage:
      type: object
      required: [items, total]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/LedgerEntry"}}, total: {type: integer}}
    WebhookEvent:
      type: object
      required: [event_id, type]
      properties:
        event_id: {type: string, maxLength: 128}
        type: {type: string, enum: [payment.confirming, payment.confirmed, payment.failed, payment.expired]}
        invoice_id: {type: string}
        provider_ref: {type: string}
        tx_ref: {type: string}
        confirmations: {type: integer, minimum: 0}
        amount: {$ref: "#/components/schemas/Money"}
