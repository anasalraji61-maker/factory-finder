openapi: 3.1.0
info:
  title: Factory Finder - logistics
  version: 0.1.0
  description: "Landed-cost engine, FX and carrier directory. Money is {amount: decimal string, currency}."
servers: [{url: http://localhost:8102}]
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /ready:
    get:
      operationId: ready
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: logistics}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: logistics}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/quotes/landed-cost:
    post:
      operationId: createQuotesLandedCost
      summary: Landed cost to the buyer's city, one option per feasible mode (sorted by total, one recommended)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LandedCostRequest"}}}
      responses:
        "200": {description: quote, content: {application/json: {schema: {$ref: "#/components/schemas/LandedCostQuoteResponse"}}}}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/fx/rates:
    get:
      operationId: listFxRates
      summary: Rates per 1 unit of base
      parameters: [{name: base, in: query, schema: {type: string, default: USD, pattern: "^[A-Z]{3}$"}}]
      responses:
        "200": {description: rates, content: {application/json: {schema: {$ref: "#/components/schemas/FxRates"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/fx/convert:
    post:
      operationId: createFxConvert
      summary: Convert an amount
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ConvertRequest"}}}
      responses:
        "200": {description: converted, content: {application/json: {schema: {$ref: "#/components/schemas/ConvertResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/carriers:
    get:
      operationId: listCarriers
      summary: Carrier / forwarder directory (mock)
      parameters:
        - {name: origin_country, in: query, schema: {$ref: "../schemas/common.schema.json#/$defs/CountryCode"}}
        - {name: destination_country, in: query, schema: {$ref: "../schemas/common.schema.json#/$defs/CountryCode"}}
        - {name: mode, in: query, schema: {$ref: "../schemas/common.schema.json#/$defs/TransportMode"}}
      responses:
        "429": {description: Error, content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
        "200": {description: carriers, content: {application/json: {schema: {$ref: "#/components/schemas/CarrierList"}}}}
  /v1/hs/search:
    get:
      operationId: getHsSearch
      summary: HS-code finder (curated, indicative dataset; confirm with a customs broker)
      description: Arabic/English token search; a numeric q is a code-prefix match. q is required (non-blank).
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {name: destination_country, in: query, description: "Country whose duty table feeds typical_duty_percent_hint", schema: {type: string, pattern: "^[A-Z]{2}$", default: IQ}}
      responses:
        "200": {description: matches (best first), content: {application/json: {schema: {$ref: "#/components/schemas/HsSearchResponse"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/hs/suggest:
    get:
      operationId: getHsSuggest
      summary: Indicative HS-heading suggestions from a free-text goods description (ar/en/zh); never an official classification
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 5}}
      responses:
        "200": {description: ranked suggestions (best first; may be empty), content: {application/json: {schema: {$ref: "#/components/schemas/HsSuggestResponse"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/hs/{code}:
    get:
      operationId: getHsByCode
      summary: One HS subheading by 6-digit code (dots and 8/10-digit national codes are truncated to 6)
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: destination_country, in: query, schema: {type: string, pattern: "^[A-Z]{2}$", default: IQ}}
      responses:
        "200": {description: item, content: {application/json: {schema: {$ref: "#/components/schemas/HsDetailResponse"}}}}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/compliance/countries:
    get:
      operationId: listComplianceCountries
      summary: Destinations covered by the import-compliance advisor (indicative)
      responses:
        "429": {description: Error, content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
        "200": {description: coverage list, content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceCountryList"}}}}
  /v1/compliance/countries/{code}:
    get:
      operationId: getComplianceCountriesByCode
      summary: Full compliance profile of a destination (EU members resolve to the EU profile; unknown countries to a generic low-confidence profile)
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: "^[A-Z]{2}$"}}
      responses:
        "200": {description: profile, content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceProfile"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/compliance/incoterms:
    get:
      operationId: listComplianceIncoterms
      summary: Who pays which landed-cost leg under each incoterm (same table the quote engine uses)
      parameters:
        - {name: incoterm, in: query, schema: {$ref: "../schemas/common.schema.json#/$defs/Incoterm"}}
      responses:
        "200": {description: incoterm matrix, content: {application/json: {schema: {$ref: "#/components/schemas/IncotermList"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/compliance/checklist:
    post:
      operationId: createComplianceChecklist
      summary: Import-compliance checklist for a destination (documents, restriction flags, incoterm split, clearance timeline). Indicative only.
      description: Deterministic, bilingual (ar+en), no network. Always carries source, as_of, confidence and the "verify with a licensed customs broker" label.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceRequest"}}}
      responses:
        "200": {description: checklist, content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceChecklist"}}}}
        "422": {$ref: "#/components/responses/Error"}
components:
  responses:
    Error: {description: error, content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}}
  schemas:
    HsItem:
      type: object
      required: [code, chapter, description_en, description_ar, typical_duty_percent_hint, keywords]
      properties:
        code: {type: string, pattern: "^[0-9]{6}$"}
        chapter: {type: string, pattern: "^[0-9]{2}$"}
        description_en: {type: string}
        description_ar: {type: string}
        typical_duty_percent_hint: {type: [number, "null"], description: "From the approximate duty table by chapter; null when the chapter is not tabulated"}
        keywords: {type: array, items: {type: string}}
    HsSearchResponse:
      type: object
      required: [items, total, destination_country, disclaimer]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/HsItem"}}
        total: {type: integer}
        destination_country: {type: string}
        disclaimer: {type: string}
    HsSuggestItem:
      type: object
      required: [hs6, description_en, description_ar, confidence, note]
      properties:
        hs6: {type: string, pattern: "^[0-9]{6}$"}
        description_en: {type: string}
        description_ar: {type: string}
        confidence: {type: string, enum: [low, medium]}
        note: {type: string, description: "Always states the suggestion is indicative, not an official classification"}
    HsSuggestResponse:
      type: object
      required: [items, total, indicative, disclaimer]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/HsSuggestItem"}}
        total: {type: integer}
        indicative: {type: boolean, const: true}
        disclaimer: {type: string}
    HsDetailResponse:
      allOf:
        - $ref: "#/components/schemas/HsItem"
        - type: object
          properties: {destination_country: {type: string}, disclaimer: {type: string}}
    DaysRange:
      type: object
      required: [min, max]
      properties: {min: {type: integer, minimum: 0}, max: {type: integer, minimum: 0}}
    IndicativeMeta:
      type: object
      required: [indicative, source, as_of, confidence, label_en, label_ar, disclaimer_en, disclaimer_ar]
      properties:
        indicative: {type: boolean, const: true}
        source: {type: string}
        as_of: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
        confidence: {type: string, enum: [low, medium, high]}
        label_en: {type: string}
        label_ar: {type: string}
        disclaimer_en: {type: string}
        disclaimer_ar: {type: string}
    ComplianceRequest:
      type: object
      required: [destination_country]
      properties:
        destination_country: {$ref: "../schemas/common.schema.json#/$defs/CountryCode"}
        hs_code: {type: string, description: "2-10 digits, dots allowed; wins over category"}
        category: {type: string, description: "e.g. electronics, machinery, food, textiles, production_line"}
        origin_country: {$ref: "../schemas/common.schema.json#/$defs/CountryCode"}
        incoterm: {$ref: "../schemas/common.schema.json#/$defs/Incoterm", default: EXW}
        mode: {$ref: "../schemas/common.schema.json#/$defs/TransportMode", default: sea_fcl_40}
        condition: {type: string, enum: [new, used], default: new}
        dangerous_goods: {type: boolean, default: false}
    ComplianceDocument:
      type: object
      required: [id, requirement, stage, name_en, name_ar, note_en, note_ar, program, lead_days, confidence]
      properties:
        id: {type: string}
        requirement: {type: string, enum: [required, conditional, recommended]}
        stage: {type: string, enum: [pre_shipment, shipping, clearance]}
        name_en: {type: string}
        name_ar: {type: string}
        note_en: {type: string}
        note_ar: {type: string}
        program: {type: boolean, description: "true for a conformity / advance-information program (not a plain commercial document)"}
        lead_days: {oneOf: [{$ref: "#/components/schemas/DaysRange"}, {type: "null"}]}
        confidence: {type: string, enum: [low, medium, high]}
    ComplianceRestriction:
      type: object
      required: [id, severity, scope, text_en, text_ar, confidence]
      properties:
        id: {type: string}
        severity: {type: string, enum: [prohibited, licence_required, restricted, enhanced_scrutiny]}
        scope: {type: string, enum: [general, product, origin, condition]}
        text_en: {type: string}
        text_ar: {type: string}
        confidence: {type: string, enum: [low, medium, high]}
    IncotermLeg:
      type: object
      required: [stage, label_en, label_ar, payer, in_landed_cost]
      properties:
        stage: {type: string, enum: [origin_inland, origin_handling, main_leg, insurance, destination_handling, duties, taxes, clearance, destination_inland]}
        label_en: {type: string}
        label_ar: {type: string}
        payer: {type: string, enum: [buyer, seller]}
        in_landed_cost: {type: boolean, description: "true when the buyer pays it, i.e. it is added on top of the supplier price in the landed-cost quote"}
    IncotermInfo:
      type: object
      required: [incoterm, text_en, text_ar, sea_only, legs, customs_value_adds]
      properties:
        incoterm: {$ref: "../schemas/common.schema.json#/$defs/Incoterm"}
        text_en: {type: string}
        text_ar: {type: string}
        sea_only: {type: boolean}
        legs: {type: array, items: {$ref: "#/components/schemas/IncotermLeg"}}
        customs_value_adds: {type: array, items: {type: string}, description: "buyer-paid stages added to the goods price to form the customs value"}
    IncotermList:
      type: object
      required: [items, total, note_en, note_ar]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/IncotermInfo"}}
        total: {type: integer}
        note_en: {type: string}
        note_ar: {type: string}
    IncotermSuggestionWarning:
      type: object
      required: [code, en, ar]
      properties: {code: {type: string}, en: {type: string}, ar: {type: string}}
    IncotermSuggestion:
      type: object
      required: [recommended, alternatives, avoid, rationale_en, rationale_ar, warnings, supplied_matches_recommendation]
      properties:
        recommended: {$ref: "../schemas/common.schema.json#/$defs/Incoterm"}
        alternatives: {type: array, items: {$ref: "../schemas/common.schema.json#/$defs/Incoterm"}}
        avoid: {type: array, items: {$ref: "../schemas/common.schema.json#/$defs/Incoterm"}}
        rationale_en: {type: string}
        rationale_ar: {type: string}
        warnings: {type: array, items: {$ref: "#/components/schemas/IncotermSuggestionWarning"}}
        supplied_matches_recommendation: {type: boolean}
    ChecklistIncoterm:
      allOf:
        - $ref: "#/components/schemas/IncotermInfo"
        - type: object
          required: [selected, customs_value_basis, suggestion]
          properties:
            selected: {$ref: "../schemas/common.schema.json#/$defs/Incoterm"}
            customs_value_basis: {type: string, enum: [CIF, FOB]}
            suggestion: {$ref: "#/components/schemas/IncotermSuggestion"}
    ComplianceTimeline:
      type: object
      required: [pre_shipment_days, clearance_days, total_days, basis_en, basis_ar]
      properties:
        pre_shipment_days: {$ref: "#/components/schemas/DaysRange"}
        clearance_days: {$ref: "#/components/schemas/DaysRange"}
        total_days: {$ref: "#/components/schemas/DaysRange"}
        basis_en: {type: string}
        basis_ar: {type: string}
    ComplianceProduct:
      type: object
      required: [hs_code, chapter, group, resolved_from, group_name_en, group_name_ar, condition]
      properties:
        hs_code: {type: [string, "null"]}
        chapter: {type: [string, "null"]}
        group: {type: string}
        resolved_from: {type: string, enum: [hs_code, category, default]}
        group_name_en: {type: string}
        group_name_ar: {type: string}
        condition: {type: string, enum: [new, used]}
    ComplianceChecklist:
      type: object
      required: [destination_country, profile_id, profile_name_en, profile_name_ar, covered, mode, product, documents, restrictions, incoterm, timeline, authority_en, authority_ar, notes_en, notes_ar, indicative, assumptions]
      properties:
        destination_country: {type: string}
        profile_id: {type: string, description: "EU for member states, ZZ for the generic fallback"}
        profile_name_en: {type: string}
        profile_name_ar: {type: string}
        covered: {type: boolean}
        origin_country: {type: [string, "null"]}
        mode: {$ref: "../schemas/common.schema.json#/$defs/TransportMode"}
        product: {$ref: "#/components/schemas/ComplianceProduct"}
        documents: {type: array, items: {$ref: "#/components/schemas/ComplianceDocument"}}
        restrictions: {type: array, items: {$ref: "#/components/schemas/ComplianceRestriction"}}
        incoterm: {$ref: "#/components/schemas/ChecklistIncoterm"}
        timeline: {$ref: "#/components/schemas/ComplianceTimeline"}
        authority_en: {type: string}
        authority_ar: {type: string}
        notes_en: {type: string}
        notes_ar: {type: string}
        indicative: {$ref: "#/components/schemas/IndicativeMeta"}
        assumptions: {type: array, items: {type: string}}
    ComplianceCountrySummary:
      type: object
      required: [code, name_en, name_ar, covered, members, confidence, as_of, customs_system]
      properties:
        code: {type: string}
        name_en: {type: string}
        name_ar: {type: string}
        covered: {type: boolean}
        members: {type: array, items: {type: string}}
        confidence: {type: string, enum: [low, medium, high]}
        as_of: {type: string}
        customs_system: {type: string}
    ComplianceCountryList:
      type: object
      required: [items, total, as_of, label_en, label_ar]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ComplianceCountrySummary"}}
        total: {type: integer}
        as_of: {type: string}
        label_en: {type: string}
        label_ar: {type: string}
    ComplianceProfile:
      type: object
      required: [code, name_en, name_ar, authority_en, authority_ar, customs_system, customs_value_basis, ddp_feasible, covered, notes_en, notes_ar, documents, restrictions, clearance_days, source, as_of, confidence, requested_country, profile_id, indicative]
      description: Raw curated entry. documents/restrictions carry applicability filters (groups, hs_prefixes, origins, modes, condition).
      properties:
        code: {type: string}
        requested_country: {type: string}
        profile_id: {type: string}
        name_en: {type: string}
        name_ar: {type: string}
        authority_en: {type: string}
        authority_ar: {type: string}
        customs_system: {type: string}
        customs_value_basis: {type: string, enum: [CIF, FOB]}
        ddp_feasible: {type: string, enum: [rarely, possible]}
        covered: {type: boolean}
        members: {type: array, items: {type: string}}
        notes_en: {type: string}
        notes_ar: {type: string}
        documents: {type: array, items: {type: object}}
        restrictions: {type: array, items: {type: object}}
        clearance_days:
          type: object
          required: [sea, air, road, rail]
          properties:
            sea: {$ref: "#/components/schemas/DaysRange"}
            air: {$ref: "#/components/schemas/DaysRange"}
            road: {$ref: "#/components/schemas/DaysRange"}
            rail: {$ref: "#/components/schemas/DaysRange"}
        source: {type: string}
        as_of: {type: string}
        confidence: {type: string, enum: [low, medium, high]}
        indicative: {$ref: "#/components/schemas/IndicativeMeta"}
    ComplianceHint:
      type: object
      description: Additive, optional summary on landed-cost quotes (recommended mode, quote incoterm). Indicative; full detail via POST /v1/compliance/checklist.
      required: [destination_country, covered, product_group, required_programs, restriction_flags, highest_severity, clearance_days, pre_shipment_days, confidence, as_of, label_en, label_ar, details]
      properties:
        destination_country: {type: string}
        covered: {type: boolean}
        product_group: {type: string}
        required_programs: {type: array, items: {type: string}}
        restriction_flags: {type: integer}
        highest_severity: {type: [string, "null"]}
        clearance_days: {$ref: "#/components/schemas/DaysRange"}
        pre_shipment_days: {$ref: "#/components/schemas/DaysRange"}
        confidence: {type: string, enum: [low, medium, high]}
        as_of: {type: string}
        label_en: {type: string}
        label_ar: {type: string}
        details: {type: string}
    Health:
      type: object
      properties: {status: {type: string}, service: {type: string}, version: {type: string}}
    GoodsInput:
      type: object
      required: [total_weight_kg]
      description: Give total_value or unit_price (x quantity). Volume is estimated (250 kg/m3) when omitted.
      properties:
        listing_id: {type: string}
        description: {type: string}
        quantity: {type: string, description: decimal, default: "1"}
        unit: {type: string}
        total_value: {$ref: "../schemas/common.schema.json#/$defs/Money"}
        unit_price: {$ref: "../schemas/common.schema.json#/$defs/Money"}
        total_weight_kg: {type: string, description: decimal}
        total_volume_m3: {type: string, description: decimal}
        hs_code: {type: string}
        category: {type: string, description: "e.g. electronics, machinery, apparel, furniture, plastics, steel, vehicles"}
        dangerous_goods: {type: boolean, default: false}
    LandedCostRequest:
      example: {
        "goods": {
          "description": "chairs",
          "quantity": "500",
          "total_value": {
            "amount": "5000",
            "currency": "USD"
          },
          "total_weight_kg": "3000",
          "total_volume_m3": "30"
        },
        "origin": {
          "country_code": "CN",
          "city": "Shenzhen"
        },
        "destination": {
          "country_code": "IQ",
          "city": "Erbil"
        },
        "display_currency": "USD"
      }
      type: object
      required: [goods, origin, destination]
      properties:
        goods: {$ref: "#/components/schemas/GoodsInput"}
        origin: {$ref: "../schemas/common.schema.json#/$defs/Location"}
        destination: {$ref: "../schemas/common.schema.json#/$defs/Location"}
        supplier_incoterm: {$ref: "../schemas/common.schema.json#/$defs/Incoterm", default: EXW}
        modes: {type: array, items: {$ref: "../schemas/common.schema.json#/$defs/TransportMode"}, description: "Filter; also bypasses minimum-size rules for FCL/rail"}
        display_currency: {$ref: "../schemas/common.schema.json#/$defs/CurrencyCode", default: USD}
        insurance: {type: boolean, default: true}
        avoid:
          type: array
          uniqueItems: true
          items: {type: string, enum: [suez, hormuz, bab_el_mandeb, panama]}
          description: >
            Optional sea chokepoints to route around (values accepted by geo `avoid`). Sea distance, transit days and
            main-leg cost are re-estimated (a distance-based adjustment, labelled an estimate in `assumptions`).
            If no sea route exists, that option is priced on the unrestricted route with an assumption note saying avoid was not applied (never a failure).
        freight_override:
          description: >
            Optional forwarder quote (the object returned by freight GET /v1/freight/quotes/{id}/landed-cost-input).
            When valid and unexpired, the main-leg line uses it as an exact price (estimate=false, no range,
            plus an extra additive boolean `quoted: true` on the line) instead of the table/live estimate, in options whose mode family matches
            (all options when mode_family is absent). Expired or malformed values are ignored (never a 422)
            and an assumption note says why. Quote currency is converted through the FX adapter.
          allOf: [{$ref: "#/components/schemas/FreightOverride"}]
    FreightOverride:
      type: object
      required: [amount, currency, source, quote_id, valid_until]
      properties:
        amount: {type: string, pattern: '^\d+(\.\d{1,2})?$', description: "exact decimal, greater than 0"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        source: {type: string, const: forwarder_quote}
        quote_id: {type: string, maxLength: 64}
        valid_until: {type: string, format: date-time}
        mode_family: {type: string, enum: [sea, air, rail, road], description: "optional; restricts the override to options of this family"}
    LandedCostQuoteResponse:
      example: {
        "id": "qte_fb15d0ab48d544e599d3cb5080faf979",
        "currency": "USD",
        "origin": {
          "country_code": "CN",
          "city": "Shenzhen"
        },
        "destination": {
          "country_code": "IQ",
          "city": "Erbil"
        },
        "options": [
          {
            "mode": "sea_fcl_40",
            "origin_hub": "CNSZX",
            "destination_hub": "IQUQR",
            "route_summary": "Shenzhen Shekou Port -> Umm Qasr Port (sea) -> destination",
            "lines": [
              {
                "stage": "goods",
                "description": "Goods price from supplier",
                "amount": {
                  "amount": "5000.00",
                  "currency": "USD"
                },
                "original_amount": {
                  "amount": "5000.00",
                  "currency": "USD"
                },
                "fx_rate": "1",
                "source": "supplier quote; priced 2026-10-15T17:46:22Z; FX mock 2026-01-01T00:00:00Z",
                "estimate": false,
                "as_of": "2026-10-15T17:46:22Z"
              },
              {
                "stage": "origin_inland",
                "description": "Truck from factory to Shenzhen Shekou Port (22 km)",
                "amount": {
                  "amount": "60.00",
                  "currency": "USD"
                },
                "original_amount": {
                  "amount": "60.00",
                  "currency": "USD"
