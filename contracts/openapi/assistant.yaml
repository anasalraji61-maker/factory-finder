openapi: 3.1.0
info:
  title: Factory Finder - assistant
  version: 0.1.0
servers:
  - url: http://localhost:8109
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: assistant}
                  version: {type: string}
  /ready:
    get:
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: assistant}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: assistant}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/assistant/query:
    post:
      parameters:
        - name: X-User-Id
          in: header
          required: false
          description: Caller identity (set by the gateway; never read from the message text). Optional, but shipment_status and deal_status answer "sign in required" (no downstream call) without it. Also keys the daily quota (anonymous callers share a small per-client bucket).
          schema: {type: string, pattern: "^[A-Za-z0-9_.:@-]{1,64}$"}
      summary: Arabic/English natural-language query -> intent, structured query and one combined answer (answer_text is in the language detected from the query, Arabic by default)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssistantRequest"}
      responses:
        "200":
          description: Answer (downstream failures are reported in warnings, not as errors)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssistantResponse"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429":
          description: Daily per-user quota exceeded (error.code quota_exceeded, details.limit, details.retry_after_seconds)
          headers: {Retry-After: {schema: {type: integer}}}
          content:
            application/json:
              schema: {$ref: ../schemas/common.schema.json#/$defs/Error}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: assistant}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: assistant}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller}
components:
  responses:
    Error:
      description: Error body
      content:
        application/json:
          schema: {$ref: ../schemas/common.schema.json#/$defs/Error}
  schemas:
    AssistantRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 1000}
        locale: {type: string, enum: [ar, en], default: ar}
        destination:
          description: Fallback destination when the text names none
          $ref: ../schemas/common.schema.json#/$defs/Location
    ParsedQuery:
      type: object
      required: [intent]
      properties:
        intent: {type: string, enum: [search, quote, trust, track, help, shipment_status, deal_status, compare, hs_lookup, create_rfq_draft]}
        language: {type: string, enum: [ar, en]}
        kind: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}
        condition: {type: string, enum: [new, used, refurbished]}
        keywords: {type: array, items: {type: string}}
        query: {type: string}
        category: {type: string}
        quantity: {type: string, description: decimal}
        unit: {type: string}
        budget:
          type: object
          required: [amount, currency, bound]
          properties:
            amount: {type: string}
            currency: {$ref: ../schemas/common.schema.json#/$defs/CurrencyCode}
            bound: {type: string, enum: [max, min]}
        origin: {$ref: ../schemas/common.schema.json#/$defs/Location}
        origin_region: {type: string}
        destination: {$ref: ../schemas/common.schema.json#/$defs/Location}
        supplier_id: {type: string}
        reference: {type: string}
        reference_type: {type: string, enum: [container, awb, vessel_imo]}
        deal_id: {type: string}
        listing_ids: {type: array, items: {type: string}}
        hs_code: {type: string, description: digits only}
        hs_query: {type: string}
        incoterm: {$ref: ../schemas/common.schema.json#/$defs/Incoterm}
        confidence: {type: number, minimum: 0, maximum: 1}
    AssistantResponse:
      type: object
      required: [intent, parsed_query, answer_text, listings, warnings]
      properties:
        intent: {type: string, enum: [search, quote, trust, track, help, shipment_status, deal_status, compare, hs_lookup, create_rfq_draft]}
        parsed_query: {$ref: "#/components/schemas/ParsedQuery"}
        answer_text: {type: string, description: Concise Arabic answer}
        listings: {type: array, items: {$ref: ../schemas/common.schema.json#/$defs/Listing}}
        quote: {$ref: ../schemas/common.schema.json#/$defs/LandedCostQuote}
        trust: {$ref: ../schemas/common.schema.json#/$defs/TrustScore}
        cards:
          type: array
          description: Structured, bilingual cards for the app to render (tool intents; additive, absent/empty otherwise). Third-party text inside is sanitized data.
          items: {$ref: "#/components/schemas/Card"}
        warnings:
          type: array
          description: "e.g. deals_unavailable, prompt_injection_ignored (the user's own text tried to override instructions; answered with help only), untrusted_text_filtered (instruction-like third-party text was removed), compare_limited_to_two, sourcing_unavailable, logistics_unavailable, trust_unavailable, tracking_unavailable, quote_insufficient_data"
          items: {type: string}
    CardRow:
      type: object
      required: [key, label, label_ar]
      properties:
        key: {type: string}
        label: {type: string}
        label_ar: {type: string}
        value: {type: [string, "null"]}
        value_ar: {type: [string, "null"]}
        values: {type: [array, "null"], items: {type: string}, description: Comparison rows - one entry per column}
        highlight: {type: [integer, "null"], description: Comparison rows - index of the better column when meaningful}
    CardColumn:
      type: object
      required: [id, title]
      properties:
        id: {type: string}
        title: {type: string}
        title_ar: {type: [string, "null"]}
    Card:
      type: object
      required: [type, title, title_ar, severity, rows, refs]
      properties:
        type: {type: string, enum: [shipment_status, deal_status, listing_comparison, hs_code, rfq_draft, notice]}
        title: {type: string}
        title_ar: {type: string}
        severity: {type: string, enum: [info, ok, warning, error]}
        rows: {type: array, items: {$ref: "#/components/schemas/CardRow"}}
        columns: {type: [array, "null"], items: {$ref: "#/components/schemas/CardColumn"}}
        refs: {type: object, additionalProperties: {type: string}, description: "Ids for deep links (shipment_id, deal_id, listing_a/listing_b, hs_code); rfq_draft cards carry deep_link=/requests/new, draft=true, missing (comma-separated required field keys) and prefill_<field> values taken only from the user's text - the assistant never creates the request; or a notice code (auth_required_*, *_not_found, *_unavailable)"}
        footnote: {type: [string, "null"]}
        footnote_ar: {type: [string, "null"]}
