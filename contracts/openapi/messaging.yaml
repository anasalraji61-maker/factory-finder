openapi: 3.1.0
info: {title: Factory Finder messaging, version: 0.1.0, description: "Conversations and messages between buyers/suppliers. All /v1 routes need X-User-Id (401 if missing); non-participants get 403 (a gateway-set X-Supplier-Id lets the user who claimed that sup_* supplier act as its participant). Realtime: WebSocket /v1/ws/conversations/{id}?user_id= (dev) pushes message.created, read.updated, typing; client frames: ping, typing{is_typing}, read{message_id}. Close codes 4401 unauthenticated, 4403 forbidden, 4429 too many connections. The gateway proxy additionally closes with 1009 (oversized client frame), 1001 (session lifetime elapsed) and 1011 (upstream unavailable)."}
servers: [{url: http://localhost:8106}]
paths:
  /health:
    get: {operationId: health, responses: {"200": {description: ok}}}
  /ready:
    get:
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: messaging}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: messaging}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/conversations:
    get:
      operationId: listConversations
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 10000}}
        - {name: context_type, in: query, schema: {$ref: "#/components/schemas/ContextType"}}
        - {name: context_ref_id, in: query, schema: {type: string}}
        - {name: unread_only, in: query, schema: {type: boolean, default: false}}
        - {name: archived, in: query, schema: {type: boolean, default: false}, description: "false (default) hides conversations the caller archived; true lists only those. Conversations with someone the caller blocked are never listed."}
      responses:
        "200": {description: "Caller's conversations, newest activity first", content: {application/json: {schema: {$ref: "#/components/schemas/ConversationPage"}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      operationId: createConversation
      description: Idempotent per (participant set, context). 201 when created, 200 when it already existed.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationCreate"}}}}
      responses:
        "200": {description: Existing conversation, content: {application/json: {schema: {$ref: "#/components/schemas/Conversation"}}}}
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Conversation"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/conversations/unread-total:
    get:
      operationId: getUnreadTotal
      description: "Badge count for the caller: unread messages across visible conversations, excluding muted and archived ones (per-conversation unread_count still counts them)."
      responses:
        "200": {description: Total, content: {application/json: {schema: {type: object, required: [unread_total], properties: {unread_total: {type: integer, minimum: 0}}}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/conversations/{id}:
    get:
      operationId: getConversation
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Conversation, content: {application/json: {schema: {$ref: "#/components/schemas/Conversation"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      description: Newest first. Pass next_cursor as cursor to get older messages.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/MessagePage"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      operationId: sendMessage
      description: With client_message_id the call is idempotent (200 on replay, 201 on first send). Abuse words flag (default), mask or reject the message.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MessageCreate"}}}}
      responses:
        "200": {description: Replay of an earlier send, content: {application/json: {schema: {$ref: "#/components/schemas/Message"}}}}
        "201": {description: Sent, content: {application/json: {schema: {$ref: "#/components/schemas/Message"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/conversations/{id}/read:
    post:
      operationId: markRead
      description: Moves the caller's read pointer to message_id (default newest). Never moves backwards.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {message_id: {type: [string, "null"]}}}}}}
      responses:
        "200": {description: Read state, content: {application/json: {schema: {$ref: "#/components/schemas/ReadState"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/conversations/{id}/preferences:
    put:
      operationId: setConversationPreferences
      description: "Per-user mute/archive; idempotent, omitted fields unchanged, never visible to the counterparty. A new message from someone else un-archives the thread for the recipient."
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {muted: {type: [boolean, "null"]}, archived: {type: [boolean, "null"]}}}}}}
      responses:
        "200": {description: Resulting preferences, content: {application/json: {schema: {type: object, required: [conversation_id, muted, archived], properties: {conversation_id: {type: string}, muted: {type: boolean}, archived: {type: boolean}}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/blocks:
    get:
      operationId: listBlocks
      responses:
        "200": {description: Users the caller blocked, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [user_id, blocked_at], properties: {user_id: {type: string}, blocked_at: {type: string, format: date-time}}}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/blocks/{user_id}:
    parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
    put:
      operationId: blockUser
      description: "Idempotent. Direct (two-party) conversations with the blocked user are hidden from the caller (404), and the blocked user's new messages / new conversations toward the caller fail with the same 404 conversation_not_found as an unknown conversation (the block is not revealed). Platform accounts cannot be blocked (422)."
      responses:
        "204": {description: Blocked}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      operationId: unblockUser
      description: Idempotent; restores visibility of existing threads.
      responses:
        "204": {description: Unblocked}
        "401": {$ref: "#/components/responses/Error"}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: messaging}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: messaging}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller}
components:
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: "../schemas/common.schema.json#/$defs/Error"}}}
  schemas:
    Role: {type: string, enum: [buyer, supplier, platform]}
    ContextType: {type: string, enum: [listing, request, deal, support]}
    Context:
      type: object
      required: [type]
      properties: {type: {$ref: "#/components/schemas/ContextType"}, ref_id: {type: [string, "null"]}}
    ConversationCreate:
      type: object
      properties:
        participants: {type: array, items: {type: object, required: [user_id], properties: {user_id: {type: string}, role: {$ref: "#/components/schemas/Role"}}}}
        my_role: {$ref: "#/components/schemas/Role"}
        context: {$ref: "#/components/schemas/Context"}
        title: {type: [string, "null"]}
        supplier_ref: {type: [string, "null"], pattern: "^sup_[A-Za-z0-9_.:-]{1,59}$", description: "Catalog supplier id; added as a supplier participant. Whoever claims that supplier (gateway-set X-Supplier-Id) can read and answer the conversation."}
    Participant:
      type: object
      required: [user_id, role]
      properties: {user_id: {type: string}, role: {$ref: "#/components/schemas/Role"}, joined_at: {type: string, format: date-time}, last_read_seq: {type: integer}, last_read_at: {type: [string, "null"], format: date-time}}
    LastMessage:
      type: object
      properties: {id: {type: string}, seq: {type: integer}, type: {type: string}, sender_id: {type: [string, "null"]}, preview: {type: [string, "null"]}, event: {type: [string, "null"]}, flagged: {type: boolean}, created_at: {type: string, format: date-time}}
    Conversation:
      type: object
      required: [id, participants, unread_count]
      properties:
        id: {type: string}
        context: {oneOf: [{$ref: "#/components/schemas/Context"}, {type: "null"}]}
        title: {type: [string, "null"]}
        supplier_ref: {type: [string, "null"], description: "Catalog supplier (sup_*) the conversation is addressed to, if any"}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        participants: {type: array, items: {$ref: "#/components/schemas/Participant"}}
        unread_count: {type: integer, description: "for the caller"}
        muted: {type: boolean, description: "caller's own preference"}
        archived: {type: boolean, description: "caller's own preference"}
        last_message: {oneOf: [{$ref: "#/components/schemas/LastMessage"}, {type: "null"}]}
    ConversationPage:
      type: object
      required: [items, total, page, page_size, unread_total]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Conversation"}}, total: {type: integer}, page: {type: integer}, page_size: {type: integer}, unread_total: {type: integer}}
    Attachment:
      type: object
      required: [url, mime, size]
      properties: {url: {type: string}, mime: {type: string}, size: {type: integer}, name: {type: [string, "null"]}}
    MediaAttachment:
      type: object
      description: Reference to a file held by the media service (no bytes in messaging). `url` must be a media-service URL (host/path-prefix validated by config; relative `/v1/media/files/<id>.<ext>` accepted).
      required: [url, kind]
      properties:
        url: {type: string, maxLength: 2048}
        kind: {type: string, enum: [image, document]}
        size: {type: [integer, "null"], minimum: 1}
        name: {type: [string, "null"], maxLength: 255}
    MessageCreate:
      type: object
      properties:
        type: {type: string, enum: [text, attachment, offer_ref], default: text}
        text: {type: [string, "null"]}
        attachment: {$ref: "#/components/schemas/Attachment"}
        attachments: {type: array, maxItems: 5, items: {$ref: "#/components/schemas/MediaAttachment"}, description: "Optional media attachments (max 5, config-limited). Allowed on type text/attachment; an attachments-only message needs no text. Not combinable with attachment/offer_ref. Errors: 422 too_many_attachments | attachment_url_not_allowed | invalid_attachment."}
        offer_ref: {type: object, required: [offer_id], properties: {offer_id: {type: string}, request_id: {type: [string, "null"]}}}
        client_message_id: {type: string, maxLength: 64}
    Message:
      type: object
      required: [id, conversation_id, seq, type, created_at]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        seq: {type: integer}
        sender_id: {type: [string, "null"]}
        type: {type: string, enum: [text, attachment, offer_ref, system]}
        text: {type: [string, "null"]}
        attachment: {oneOf: [{$ref: "#/components/schemas/Attachment"}, {type: "null"}]}
        attachments: {type: array, items: {$ref: "#/components/schemas/MediaAttachment"}}
        offer_ref: {type: [object, "null"]}
        event: {type: [string, "null"]}
        event_data: {type: [object, "null"]}
        flags: {type: array, items: {type: string}}
        flagged: {type: boolean}
        client_message_id: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        read_by: {type: array, items: {type: string}}
    MessagePage:
      type: object
      required: [items, has_more]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Message"}}, next_cursor: {type: [string, "null"]}, has_more: {type: boolean}}
    ReadState:
      type: object
      properties: {conversation_id: {type: string}, user_id: {type: string}, last_read_seq: {type: integer}, last_read_message_id: {type: [string, "null"]}, read_at: {type: [string, "null"], format: date-time}, unread_count: {type: integer}}
