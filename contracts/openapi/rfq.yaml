openapi: 3.1.0
info:
  title: Factory Finder - rfq
  version: 0.1.0
  description: |
    Reverse marketplace. Auth: `X-User-Id` required on every /v1 route (missing -> 401).
    Request status machine: open -> negotiating (first offer) -> awarded | closed | expired; negotiating -> open when the last active offer goes.
    Offer status: active -> accepted | rejected | withdrawn | expired. Invalid transitions answer 409 `invalid_<entity>_transition`.
    Commission (on accept): kind rate (product 3%, raw_material 2%, production_line 4%), min fee 25 USD (converted with static reference rates).
servers:
  - url: http://localhost:8105
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: rfq}
                  version: {type: string}
  /ready:
    get:
      summary: Readiness (dependencies reachable)
      description: 200 when this service can serve traffic (database reachable where one exists); 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  service: {type: string, const: rfq}
                  checks: {type: object, additionalProperties: {type: boolean}}
        "503":
          description: Not ready (a required dependency such as the database is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: unavailable}
                  service: {type: string, const: rfq}
                  checks: {type: object, additionalProperties: {type: boolean}}
  /v1/requests:
    post:
      summary: Post a buyer request
      parameters: [{$ref: "#/components/parameters/UserId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RequestCreate"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Request"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    get:
      summary: My requests (scope=mine, default) or the public feed of others' live requests (scope=public)
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {name: scope, in: query, schema: {type: string, enum: [mine, public], default: mine}}
        - {name: status, in: query, description: Only with scope=mine, schema: {$ref: "#/components/schemas/RequestStatus"}}
        - {name: kind, in: query, schema: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {$ref: "#/components/responses/RequestPage"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/requests/{id}:
    get:
      summary: Request detail (link-accessible, including private ones)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Request"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/requests/{id}/close:
    post:
      summary: Buyer closes the request (active offers are rejected)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Closed, content: {application/json: {schema: {$ref: "#/components/schemas/Request"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/requests/{id}/suggestions:
    get:
      summary: Matching listings from sourcing (buyer only)
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {$ref: "#/components/parameters/Id"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 5}}
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items]
                properties:
                  request_id: {type: string}
                  items: {type: array, items: {$ref: ../schemas/common.schema.json#/$defs/Listing}}
        "403": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/requests/{id}/offers:
    post:
      summary: Supplier submits an offer (not on own request; request must be open/negotiating)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/OfferCreate"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Offer"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    get:
      summary: Offers on a request (buyer sees all, a supplier only their own)
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {$ref: "#/components/parameters/Id"}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/OfferStatus"}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/Offer"}}
  /v1/offers/{id}/accept:
    post:
      summary: Buyer accepts an offer -> Deal with commission; other offers are rejected, request becomes awarded
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Deal, content: {application/json: {schema: {$ref: "#/components/schemas/Deal"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/reject:
    post:
      summary: Buyer rejects an offer
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Rejected, content: {application/json: {schema: {$ref: "#/components/schemas/Offer"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/withdraw:
    post:
      summary: Supplier withdraws their offer
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Withdrawn, content: {application/json: {schema: {$ref: "#/components/schemas/Offer"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/deals:
    get:
      summary: The caller's own deals, newest first (buyer = X-User-Id is buyer; supplier = X-User-Id is the offer owner). Never includes other parties' deals.
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {name: role, in: query, schema: {type: string, enum: [buyer, supplier, any], default: any}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/DealStatus"}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: One page (ordered created_at desc, id desc)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/Deal"}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/requests/{id}/deal:
    get:
      summary: Accepted deal of a request (request owner/buyer only; 404 for anyone else or when not awarded yet)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Deal"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/deals/{id}:
    get:
      summary: Deal (buyer or supplier only; others get 404)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Deal"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/deals/{id}/fulfilment/start:
    post:
      summary: Supplier starts fulfilment (paid -> in_fulfilment; idempotent)
      description: |
        Only the supplier user of the deal; when the offer carried a verified supplier ref, the gateway-verified
        X-Supplier-Id must equal it (else 403 `supplier_verification_required`). 404 for non-parties, 403 for the buyer,
        409 `invalid_deal_transition` unless the deal is paid.
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {$ref: "#/components/parameters/Id"}
        - {name: X-Supplier-Id, in: header, required: false, schema: {type: string}}
      responses:
        "200": {description: Deal, content: {application/json: {schema: {$ref: "#/components/schemas/Deal"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/deals/{id}/delivered:
    post:
      summary: Supplier marks the goods shipped / delivered (sets delivered_at; idempotent)
      description: Same caller rules as fulfilment/start. Requires status in_fulfilment (409 otherwise). Does not complete the deal.
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {$ref: "#/components/parameters/Id"}
        - {name: X-Supplier-Id, in: header, required: false, schema: {type: string}}
      responses:
        "200": {description: Deal, content: {application/json: {schema: {$ref: "#/components/schemas/Deal"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/deals/{id}/confirm-receipt:
    post:
      summary: Buyer confirms receipt (in_fulfilment -> completed; idempotent)
      description: Only the buyer (403 for the supplier, 404 for strangers). 409 unless in_fulfilment.
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Deal, content: {application/json: {schema: {$ref: "#/components/schemas/Deal"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/deals/{id}/events:
    get:
      summary: Immutable event log of a deal (buyer or supplier; others 404), oldest first
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200":
          description: Events
          content: {application/json: {schema: {$ref: "#/components/schemas/DealEventList"}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/internal/deals/{id}/payment-status:
    post:
      summary: INTERNAL (payments -> rfq). Never routed by the gateway (404 publicly).
      description: |
        Guarded by X-Internal-Token (401 `invalid_internal_token`). Idempotent by `event_id` (repeat -> outcome `duplicate`).
        Rule: the deal becomes `paid` when every invoice kind payments has reported is paid. A kind is known once it was
        settled or listed in `other_open_kinds` of another event, so with both invoices open BOTH must be paid, with a
        single invoice that one suffices (FF_RFQ_REQUIRE_BOTH_INVOICES=true always requires both).
        Refund: deal_payment -> `refunded` (pending_payment|paid) or `disputed` (in_fulfilment); commission while `paid`
        -> back to `pending_payment`; after completion only recorded. Late `paid` events never resurrect a refunded deal.
        422 `amount_mismatch` when amount/currency differ from the deal; 404 unknown deal.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentStatusCallback"}}}}
      responses:
        "200": {description: Applied, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentStatusResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/deals/{id}/reviews:
    post:
      summary: Buyer reviews a deal (once per deal)
      description: |
        Only the buyer of a deal in status paid | in_fulfilment | completed, once per deal (deleting does not free the slot).
        The deal's supplier must be a verified supplier (offer made with a gateway-verified X-Supplier-Id), else 409 `supplier_unverified`.
        Text rules: control / bidi / zero-width characters are stripped; links, emails and phone numbers -> 422 `prohibited_content`.
        Errors: 404 non-party or unknown deal, 403 supplier side of the deal, 409 `deal_not_reviewable` | `review_already_exists`.
        `X-User-Name` (set by the gateway, percent-encoded) only feeds the public reviewer label ("Ahmed K.").
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {$ref: "#/components/parameters/Id"}
        - {name: X-User-Name, in: header, required: false, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/suppliers/{supplier_ref}/reviews:
    get:
      summary: Public reviews of a supplier (no auth; deleted reviews excluded)
      description: Served by rfq (the gateway routes this path here although /v1/suppliers belongs to sourcing). With X-User-Id present (optional) the caller's own review carries `mine=true`.
      parameters:
        - {name: supplier_ref, in: path, required: true, schema: {type: string, maxLength: 64}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: sort, in: query, schema: {type: string, enum: [recent, rating], default: recent}}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/common.schema.json#/$defs/Page
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/Review"}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/suppliers/{supplier_ref}/review-summary:
    get:
      summary: Review aggregates of a supplier (public, no auth; input for the trust rating signal)
      parameters: [{name: supplier_ref, in: path, required: true, schema: {type: string, maxLength: 64}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewSummary"}}}}
  /v1/reviews/{id}:
    put:
      summary: Buyer edits own review (within 24h of creation; prior values kept in the audit trail)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: "`review_window_closed`", content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      summary: Buyer deletes own review (within 24h; soft delete, stops counting, audit trail kept)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string}
                  status: {type: string, const: deleted}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/reviews/{id}/reply:
    post:
      summary: The verified supplier of the deal posts one public reply (<= 500 chars)
      description: Requires the gateway-verified X-Supplier-Id equal to the review's supplier_ref (else 403). 409 `reply_already_exists`.
      parameters:
        - {$ref: "#/components/parameters/UserId"}
        - {$ref: "#/components/parameters/Id"}
        - {name: X-Supplier-Id, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: {type: string, minLength: 1, maxLength: 500}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/reviews/{id}/report:
    post:
      summary: Report abuse (marks flagged_for_review, never auto-hides; idempotent per user; 10 reports/hour/user -> 429)
      parameters: [{$ref: "#/components/parameters/UserId"}, {$ref: "#/components/parameters/Id"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, enum: [spam, abuse, fake, other], default: other}
                note: {type: [string, "null"], maxLength: 300}
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [id, flagged_for_review, already_reported]
                properties:
                  id: {type: string}
                  flagged_for_review: {type: boolean}
                  already_reported: {type: boolean}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/internal/users/{user_id}/export:
    post:
      operationId: internalUserExport
      summary: Internal - GDPR/store data export for one user
      description: "Service-to-service only (gateway). Needs X-Internal-Token when FF_INTERNAL_TOKEN is set; any other caller gets 404. Returns what this service holds about the user (bounded; `truncated` is true when capped). Never routed by the public gateway."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The user's data held by this service
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, data]
                properties:
                  service: {type: string, const: rfq}
                  user_id: {type: string}
                  truncated: {type: boolean}
                  data: {type: object, additionalProperties: true}
        "404": {description: Not an internal caller}
  /v1/internal/users/{user_id}/data:
    delete:
      operationId: internalUserErase
      summary: Internal - erase or anonymize one user's data (account deletion)
      description: "Service-to-service only; same guard as the export. Idempotent: repeating it returns status done with zero counts. Retention exceptions (ledger/audit) are listed in docs/decisions/account-deletion.md."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Erased/anonymized
          content:
            application/json:
              schema:
                type: object
                required: [service, user_id, status, counts]
                properties:
                  service: {type: string, const: rfq}
                  user_id: {type: string}
                  status: {type: string, const: done}
                  counts: {type: object, additionalProperties: {type: integer}}
                  retained: {type: array, items: {type: string}}
        "404": {description: Not an internal caller}
components:
  parameters:
    UserId: {name: X-User-Id, in: header, required: true, schema: {type: string}}
    Id: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Error body
      content: {application/json: {schema: {$ref: ../schemas/common.schema.json#/$defs/Error}}}
    RequestPage:
      description: One page
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../schemas/common.schema.json#/$defs/Page
              - type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Request"}}
  schemas:
    RequestStatus: {type: string, enum: [open, negotiating, awarded, closed, expired, cancelled]}
    OfferStatus: {type: string, enum: [active, withdrawn, accepted, rejected, expired]}
    DealStatus: {type: string, enum: [pending_payment, paid, in_fulfilment, completed, disputed, cancelled, refunded]}
    Money: {$ref: ../schemas/common.schema.json#/$defs/Money}
    RequestCreate:
      type: object
      required: [kind, title, quantity]
      additionalProperties: false
      properties:
        kind: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}
        title: {type: string, minLength: 3, maxLength: 200}
        description: {type: string}
        quantity: {type: [string, number], description: Positive decimal}
        unit: {type: string, default: piece}
        condition: {type: string, enum: [new, used, any], default: any}
        target_price: {$ref: "#/components/schemas/Money"}
        destination: {type: object, required: [country_code], properties: {country_code: {$ref: ../schemas/common.schema.json#/$defs/CountryCode}, city: {type: string}}}
        deadline: {type: string, format: date-time, description: Must be in the future}
        attachments: {type: array, items: {type: string}, maxItems: 10}
        visibility: {type: string, enum: [public, private], default: public}
    Request:
      type: object
      required: [kind, title, quantity, id, owner_id, status, offers_count, created_at, updated_at]
      properties:
        kind: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}
        title: {type: string, minLength: 3, maxLength: 200}
        description: {type: [string, "null"]}
        quantity: {type: string}
        unit: {type: string, default: piece}
        condition: {type: string, enum: [new, used, any], default: any}
        target_price: {$ref: "#/components/schemas/Money"}
        destination: {type: object, required: [country_code], properties: {country_code: {$ref: ../schemas/common.schema.json#/$defs/CountryCode}, city: {type: string}}}
        deadline: {type: [string, "null"], format: date-time}
        attachments: {type: array, items: {type: string}, maxItems: 10}
        visibility: {type: string, enum: [public, private], default: public}
        id: {type: string, description: "req_..."}
        owner_id: {type: string}
        status: {$ref: "#/components/schemas/RequestStatus"}
        offers_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OfferCreate:
      type: object
      required: [price, supplier_name]
      additionalProperties: false
      properties:
        price: {$ref: "#/components/schemas/Money"}
        supplier_name: {type: string}
        supplier_ref: {type: string, deprecated: true, description: "Ignored. The offer owner is X-User-Id; supplier_ref in responses is the gateway-verified X-Supplier-Id (null if none)."}
        moq: {type: integer, minimum: 0}
        lead_time_days: {type: integer, minimum: 0}
        incoterm: {$ref: ../schemas/common.schema.json#/$defs/Incoterm}
        valid_until: {type: string, format: date-time}
        notes: {type: string}
    Offer:
      type: object
      required: [price, supplier_name, id, request_id, supplier_user_id, status, created_at, updated_at]
      properties:
        price: {$ref: "#/components/schemas/Money"}
        supplier_name: {type: string}
        supplier_ref: {type: [string, "null"], description: "Gateway-verified X-Supplier-Id (null if none)."}
        moq: {type: integer, minimum: 0}
        lead_time_days: {type: integer, minimum: 0}
        incoterm: {$ref: ../schemas/common.schema.json#/$defs/Incoterm}
        valid_until: {type: [string, "null"], format: date-time}
        notes: {type: [string, "null"]}
        id: {type: string, description: "off_..."}
        request_id: {type: string}
        supplier_user_id: {type: string}
        supplier_verified: {type: boolean, description: "true when supplier_ref came from a gateway-verified X-Supplier-Id"}
        status: {$ref: "#/components/schemas/OfferStatus"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Deal:
      type: object
      required: [id, request_id, offer_id, buyer_id, supplier_user_id, kind, quantity, unit_price, subtotal, commission, supplier_net, status]
      properties:
        id: {type: string, description: "deal_..."}
        request_id: {type: string}
        offer_id: {type: string}
        buyer_id: {type: string}
        supplier_user_id: {type: string}
        kind: {$ref: ../schemas/common.schema.json#/$defs/ListingKind}
        quantity: {type: string}
        unit_price: {$ref: "#/components/schemas/Money"}
        subtotal: {$ref: "#/components/schemas/Money"}
        commission:
          type: object
          required: [rate, amount, min_fee_applied]
          properties:
            rate: {type: string, description: Decimal fraction, e.g. "0.03"}
            amount: {$ref: "#/components/schemas/Money"}
            min_fee_applied: {type: boolean}
            is_estimate: {type: boolean}
        supplier_net: {$ref: "#/components/schemas/Money"}
        status: {$ref: "#/components/schemas/DealStatus"}
        payment:
          type: object
          description: Per invoice kind, as reported by payments (null = no invoice reported yet; open = required, unpaid).
          properties:
            commission: {type: [string, "null"], enum: [open, paid, refunded, null]}
            deal_payment: {type: [string, "null"], enum: [open, paid, refunded, null]}
        delivered_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DealEventList:
      type: object
      required: [items, total]
      properties:
        total: {type: integer}
        items:
          type: array
          items:
            type: object
            required: [seq, action, actor_role, created_at]
            properties:
              seq: {type: integer}
              action: {type: string, enum: [payment_paid, payment_refunded, fulfilment_started, delivered, receipt_confirmed]}
              actor_role: {type: string, enum: [buyer, supplier, system]}
              from_status: {type: [string, "null"]}
              to_status: {type: [string, "null"]}
              data: {type: object}
              created_at: {type: string, format: date-time}
    PaymentStatusCallback:
      type: object
      required: [invoice_id, kind, status, amount, event_id]
      additionalProperties: false
      properties:
        invoice_id: {type: string}
        kind: {type: string, enum: [commission, deal_payment]}
        status: {type: string, enum: [paid, refunded]}
        amount: {$ref: "#/components/schemas/Money"}
        event_id: {type: string, maxLength: 128}
        other_open_kinds: {type: array, items: {type: string, enum: [commission, deal_payment]}, description: Other invoice kinds of the deal still open at event time}
    PaymentStatusResult:
      type: object
      required: [deal_id, outcome, deal_status, payment]
      properties:
        deal_id: {type: string}
        outcome: {type: string, enum: [applied, recorded, ignored, duplicate]}
        deal_status: {$ref: "#/components/schemas/DealStatus"}
        payment: {type: object}
    Stars: {type: integer, minimum: 1, maximum: 5}
    ReviewInput:
      type: object
      required: [rating]
      additionalProperties: false
      description: Used by POST and PUT (PUT replaces all editable fields). Text fields are sanitised; links / emails / phones -> 422.
      properties:
        rating: {$ref: "#/components/schemas/Stars"}
        title: {type: [string, "null"], maxLength: 80}
        text: {type: [string, "null"], maxLength: 1000}
        sub_ratings:
          type: [object, "null"]
          additionalProperties: false
          properties:
            quality: {oneOf: [{$ref: "#/components/schemas/Stars"}, {type: "null"}]}
            communication: {oneOf: [{$ref: "#/components/schemas/Stars"}, {type: "null"}]}
            shipping: {oneOf: [{$ref: "#/components/schemas/Stars"}, {type: "null"}]}
    Review:
      type: object
      required: [id, supplier_ref, rating, sub_ratings, reviewer, verified_purchase, edited, mine, created_at]
      properties:
        id: {type: string, description: "rev_..."}
        supplier_ref: {type: string}
        rating: {$ref: "#/components/schemas/Stars"}
        sub_ratings:
          type: object
          properties:
            quality: {type: [integer, "null"]}
            communication: {type: [integer, "null"]}
            shipping: {type: [integer, "null"]}
        title: {type: [string, "null"]}
        text: {type: [string, "null"]}
        reviewer: {type: string, description: 'First name + last initial only, e.g. "Ahmed K."; "Verified buyer" when unknown. Never an email.'}
        verified_purchase: {type: boolean}
        edited: {type: boolean}
        reply:
          type: [object, "null"]
          properties:
            text: {type: string}
            created_at: {type: string, format: date-time}
        mine: {type: boolean, description: true when X-User-Id is the author}
        editable_until: {type: [string, "null"], format: date-time, description: "Only when mine: creation + 24h"}
        flagged_for_review: {type: [boolean, "null"], description: "Only when mine"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReviewSummary:
      type: object
      required: [supplier_ref, count, average, histogram, completed_deals]
      properties:
        supplier_ref: {type: string}
        count: {type: integer}
        average: {type: [string, "null"], description: 'Decimal string rounded half-up to 2 places, e.g. "4.25"; null when count = 0'}
        histogram:
          type: object
          description: 'Reviews per star, keys "1".."5"'
          additionalProperties: {type: integer}
        sub_ratings:
          type: object
          properties:
            quality: {type: [string, "null"]}
            communication: {type: [string, "null"]}
            shipping: {type: [string, "null"]}
        completed_deals: {type: integer, description: Deals of this supplier in status completed}
