      FF_PAYMENTS_ADMIN_TOKEN: ${FF_PAYMENTS_ADMIN_TOKEN:?set FF_PAYMENTS_ADMIN_TOKEN}
      FF_PAYMENTS_WEBHOOK_SECRET_USDT_TRON: ${FF_PAYMENTS_WEBHOOK_SECRET_USDT_TRON:?set FF_PAYMENTS_WEBHOOK_SECRET_USDT_TRON}
  media:
