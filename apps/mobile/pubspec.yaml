name: factory_finder
description: "Factory Finder (مُوَرِّد) — global smart sourcing app: suppliers, trust scores and the full landed cost to the buyer's door."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Allowed dependencies are fixed by docs/AGENTS.md §Mobile contract.
# Features may use only these packages. No code generation.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  intl: any
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
