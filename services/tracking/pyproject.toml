[project]
name = "ff-tracking"
version = "0.1.0"
description = "Factory Finder tracking service: shipment tracking by container, bill of lading, air waybill or vessel IMO with a normalized event timeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.11",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.5",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "referencing>=0.35",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff_tracking"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
