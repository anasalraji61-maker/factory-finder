[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ff-sourcing"
version = "0.1.0"
description = "Factory Finder sourcing service: multi-source supplier/listing search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ff_sourcing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
