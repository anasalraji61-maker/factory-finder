[project]
name = "ff-freight"
version = "0.1.0"
description = "Factory Finder freight marketplace: forwarder applications, shipment quote requests, quotes, ranking, awards and ratings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
pg = ["asyncpg>=0.29", "alembic>=1.13"]
dev = [
    "alembic>=1.13",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "referencing>=0.35",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff_freight"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
