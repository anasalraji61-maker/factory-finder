name: e2e
on:
  push:
    paths: ["services/**", "contracts/**", "scripts/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["services/**", "contracts/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared deps
        run: pip install fastapi "uvicorn[standard]" pydantic pydantic-settings httpx sqlalchemy aiosqlite greenlet pyjwt bcrypt email-validator websockets pyyaml jsonschema referencing
      - name: Install service deps
        run: |
          for s in gateway sourcing logistics geo trust rfq messaging tracking notifications assistant demand payments media feed freight; do
            python scripts/install_service.py services/$s --deps-only
          done
      - name: Route check (code vs contract)
        run: python scripts/contract_check.py
      - name: Contract validation (response bodies vs OpenAPI schemas)
        run: python scripts/contract_validate.py
      - name: End-to-end scenario
        run: python scripts/e2e.py
      - name: Extended end-to-end flows
        run: python scripts/e2e_extended.py
      - name: Business scenarios (sequential, after the flows above)
        run: python scripts/e2e_scenarios.py
