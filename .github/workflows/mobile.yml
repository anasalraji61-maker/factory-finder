name: mobile
on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android,ios --org com.factoryfinder --project-name factory_finder
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=FF_MOCK=true
      - uses: actions/upload-artifact@v4
        with:
          name: factory-finder-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
