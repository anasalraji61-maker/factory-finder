name: mobile
on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**"]
  workflow_dispatch:
    inputs:
      mock:
        description: "Build with FF_MOCK=true (demo data, no server). Set false to talk to a real backend."
        type: boolean
        default: true
      api_base_url:
        description: "FF_API_BASE_URL (required when mock is false), e.g. https://api.example.com"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.yaml', 'apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android,ios --org com.factoryfinder --project-name factory_finder
          fi
      - name: Patch platform folders (permissions, labels)
        run: bash tool/ci_prepare_platforms.sh .
      - name: Remove default template test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt
          code=${PIPESTATUS[0]}
          msg=$(grep -E "^\s*(error|warning)" analyze.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$msg" ]; then echo "::error title=analyze::$msg"; fi
          exit $code
      - name: Test
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee test.txt
          code=${PIPESTATUS[0]}
          msg=$(grep -vE "^\s*$|✅" test.txt | grep -iE "fail|error|expected|actual|exception|\.dart" | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ $code -ne 0 ] && [ -n "$msg" ]; then echo "::error title=test::$msg"; fi
          exit $code
      - name: Build debug APK
        env:
          INPUT_MOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.mock || 'true' }}
          INPUT_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url || '' }}
        run: |
          DEFINES="--dart-define=FF_MOCK=true"
          if [ "$INPUT_MOCK" = "false" ]; then
            if [ -z "$INPUT_API_BASE_URL" ]; then echo "::error title=build::api_base_url is required when mock=false"; exit 1; fi
            DEFINES="--dart-define=FF_MOCK=false --dart-define=FF_API_BASE_URL=$INPUT_API_BASE_URL"
          fi
          flutter build apk --debug $DEFINES 2>&1 | tee build.txt
          code=${PIPESTATUS[0]}
          msg=$(grep -iE "error|fail|wrong|exception|what went wrong|requires|minSdk|plugin|\.gradle|\.kt|\.java" build.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ $code -ne 0 ] && [ -n "$msg" ]; then echo "::error title=build::$msg"; fi
          exit $code
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-logs
          path: |
            apps/mobile/analyze.txt
            apps/mobile/test.txt
            apps/mobile/build.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: factory-finder-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
