name: backend
on:
  push:
    paths: ["services/**", "packages/**", "scripts/**", "contracts/**", "ruff.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["services/**", "packages/**", "scripts/**", "contracts/**", "ruff.toml", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [geo, logistics, sourcing, trust, gateway, rfq, tracking, messaging, notifications, assistant, demand, payments, media, feed, freight]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml
            packages/*/pyproject.toml
      - run: python scripts/install_service.py services/${{ matrix.service }} --editable --extras dev
      - run: pip install ruff pytest pytest-asyncio
      - run: ruff check services/${{ matrix.service }}
      - name: Tests
        shell: bash
        working-directory: services/${{ matrix.service }}
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider -rfE --tb=short --junitxml=junit.xml 2>&1 | tee /tmp/pytest.out
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "^(FAILED|ERROR)|Error:|^E  " /tmp/pytest.out | head -15 | while IFS= read -r line; do
              echo "::error title=pytest::${line:0:400}"
            done
          fi
          exit $code
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.service }}
          path: services/${{ matrix.service }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  contract-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema referencing ruff
      - run: ruff check scripts/contract_examples.py
      - run: python scripts/contract_examples.py

  py-common:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml
            packages/*/pyproject.toml
      - run: pip install -e packages/py-common[dev] pytest pytest-asyncio ruff || pip install -e packages/py-common pytest pytest-asyncio ruff
      - run: ruff check packages/py-common
      - run: python -m pytest -q -p no:cacheprovider packages/py-common --junitxml=junit-py-common.xml
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py-common
          path: junit-py-common.xml
          if-no-files-found: ignore
          retention-days: 7
