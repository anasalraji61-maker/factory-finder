name: backend
on:
  push:
    paths: ["services/**", "scripts/**", "ruff.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["services/**", "scripts/**", "ruff.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [geo, logistics, sourcing, trust, gateway, rfq, tracking, messaging, notifications, assistant, demand, payments, media, feed, freight]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/install_service.py services/${{ matrix.service }} --editable --extras dev
      - run: pip install ruff pytest pytest-asyncio
      - run: ruff check services/${{ matrix.service }}
      - name: Tests
        shell: bash
        working-directory: services/${{ matrix.service }}
        run: |
          set +e
          python -m pytest -q -rfE --tb=short 2>&1 | tee /tmp/pytest.out
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "^(FAILED|ERROR)|Error:|^E  " /tmp/pytest.out | head -15 | while IFS= read -r line; do
              echo "::error title=pytest::${line:0:400}"
            done
          fi
          exit $code
