[project]
name = "ff-common"
version = "0.1.0"
description = "Factory Finder shared Python utilities (no business logic): window rate limiter with optional Redis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff_common"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
