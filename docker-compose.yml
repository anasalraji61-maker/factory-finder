      FF_FEED_DATABASE_URL: ${FF_FEED_DATABASE_URL:-}
      FF_FEED_DB_AUTO_CREATE: ${FF_FEED_DB_AUTO_CREATE:-}
      FF_FEED_ADMIN_TOKEN: ${FF_FEED_ADMIN_TOKEN:-}
      FF_FEED_MEDIA_BASE_URL: ${FF_MEDIA_PUBLIC_BASE_URL:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8113/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8113'
  # Optional PostgreSQL (not started by default). Usage:
  #   FF_DOCKER_EXTRAS=pg docker compose --profile pg up --build postgres rfq ...
  #   FF_RFQ_DATABASE_URL=postgresql://ff:${FF_POSTGRES_PASSWORD}@postgres:5432/ff_rfq   (one database per service)
  #   docker compose run --rm rfq alembic upgrade head     (see docs/DB.md)
  postgres:
    profiles:
    - pg
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ff
      POSTGRES_PASSWORD: ${FF_POSTGRES_PASSWORD:-}
      POSTGRES_DB: postgres
    volumes:
    - pgdata:/var/lib/postgresql/data
    expose:
    - '5432'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ff
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  pgdata: {}
  media-data: {}
