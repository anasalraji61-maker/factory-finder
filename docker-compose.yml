services:
  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: gateway
    ports:
    - 8000:8000
    environment:
      PORT: '8000'
      FF_GATEWAY_UPSTREAMS: '{"sourcing": "http://sourcing:8101", "logistics": "http://logistics:8102", "geo": "http://geo:8103", "trust": "http://trust:8104", "rfq": "http://rfq:8105", "messaging": "http://messaging:8106",
        "tracking": "http://tracking:8107", "notifications": "http://notifications:8108", "assistant": "http://assistant:8109", "demand": "http://demand:8110", "payments": "http://payments:8111", "media": "http://media:8112"}'
      FF_GATEWAY_JWT_SECRET: ${FF_GATEWAY_JWT_SECRET:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
      FF_GATEWAY_CORS_ORIGINS: ${FF_GATEWAY_CORS_ORIGINS:-[]}
      FF_GATEWAY_ADMIN_TOKEN: ${FF_GATEWAY_ADMIN_TOKEN:-}
    depends_on:
      sourcing: {condition: service_healthy}
      logistics: {condition: service_healthy}
      trust: {condition: service_healthy}
      rfq: {condition: service_healthy}
      messaging: {condition: service_healthy}
      tracking: {condition: service_healthy}
      notifications: {condition: service_healthy}
      assistant: {condition: service_healthy}
      demand: {condition: service_healthy}
      payments: {condition: service_healthy}
      media: {condition: service_healthy}
      geo: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
  sourcing:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: sourcing
    environment:
      PORT: '8101'
      FF_SOURCING_TRUST_MODE: http
      FF_SOURCING_TRUST_BASE_URL: http://trust:8104
      FF_SOURCING_DATABASE_URL: ${FF_SOURCING_DATABASE_URL:-}
      FF_SOURCING_DB_AUTO_CREATE: ${FF_SOURCING_DB_AUTO_CREATE:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8101/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8101'
  logistics:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: logistics
    environment:
      PORT: '8102'
      FF_LOGISTICS_GEO_URL: http://geo:8103
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8102/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8102'
  geo:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: geo
    environment:
      PORT: '8103'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8103/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8103'
  trust:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: trust
    environment:
      PORT: '8104'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8104/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8104'
  rfq:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: rfq
        EXTRAS: ${FF_DOCKER_EXTRAS:-}
    environment:
      PORT: '8105'
      FF_RFQ_DATABASE_URL: ${FF_RFQ_DATABASE_URL:-}
      FF_RFQ_DB_AUTO_CREATE: ${FF_RFQ_DB_AUTO_CREATE:-}
      FF_RFQ_SOURCING_URL: http://sourcing:8101
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8105/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8105'
  messaging:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: messaging
        EXTRAS: ${FF_DOCKER_EXTRAS:-}
    environment:
      PORT: '8106'
      FF_MESSAGING_DATABASE_URL: ${FF_MESSAGING_DATABASE_URL:-}
      FF_MESSAGING_DB_AUTO_CREATE: ${FF_MESSAGING_DB_AUTO_CREATE:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8106/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8106'
  tracking:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: tracking
        EXTRAS: ${FF_DOCKER_EXTRAS:-}
    environment:
      PORT: '8107'
      FF_TRACKING_DATABASE_URL: ${FF_TRACKING_DATABASE_URL:-}
      FF_TRACKING_DB_AUTO_CREATE: ${FF_TRACKING_DB_AUTO_CREATE:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8107/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8107'
  notifications:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: notifications
        EXTRAS: ${FF_DOCKER_EXTRAS:-}
    environment:
      PORT: '8108'
      FF_NOTIFICATIONS_DATABASE_URL: ${FF_NOTIFICATIONS_DATABASE_URL:-}
      FF_NOTIFICATIONS_DB_AUTO_CREATE: ${FF_NOTIFICATIONS_DB_AUTO_CREATE:-}
      FF_NOTIFICATIONS_SOURCING_BASE_URL: http://sourcing:8101
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8108/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8108'
  assistant:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: assistant
    environment:
      PORT: '8109'
      FF_ASSISTANT_SOURCING_URL: http://sourcing:8101
      FF_ASSISTANT_LOGISTICS_URL: http://logistics:8102
      FF_ASSISTANT_TRUST_URL: http://trust:8104
      FF_ASSISTANT_TRACKING_URL: http://tracking:8107
      FF_ASSISTANT_RFQ_URL: http://rfq:8105
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8109/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8109'
  demand:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: demand
        EXTRAS: ${FF_DOCKER_EXTRAS:-}
    environment:
      PORT: '8110'
      FF_DEMAND_DATABASE_URL: ${FF_DEMAND_DATABASE_URL:-}
      FF_DEMAND_DB_AUTO_CREATE: ${FF_DEMAND_DB_AUTO_CREATE:-}
      FF_DEMAND_SOURCING_BASE_URL: http://sourcing:8101
      FF_DEMAND_ENABLED: ${FF_DEMAND_ENABLED:-false}
      FF_DEMAND_DAILY_CAP: ${FF_DEMAND_DAILY_CAP:-20}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8110/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8110'
  payments:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: payments
        EXTRAS: ${FF_DOCKER_EXTRAS:-}
    environment:
      PORT: '8111'
      FF_PAYMENTS_DATABASE_URL: ${FF_PAYMENTS_DATABASE_URL:-}
      FF_PAYMENTS_DB_AUTO_CREATE: ${FF_PAYMENTS_DB_AUTO_CREATE:-}
      FF_PAYMENTS_PROVIDER: ${FF_PAYMENTS_PROVIDER:-mock}
      FF_PAYMENTS_RFQ_URL: http://rfq:8105
      FF_PAYMENTS_ADMIN_TOKEN: ${FF_PAYMENTS_ADMIN_TOKEN:-}
      FF_PAYMENTS_WEBHOOK_SECRET_MOCK: ${FF_PAYMENTS_WEBHOOK_SECRET_MOCK:-}
      FF_PAYMENTS_WEBHOOK_SECRET_USDT_TRON: ${FF_PAYMENTS_WEBHOOK_SECRET_USDT_TRON:-}
      FF_PAYMENTS_USDT_RECEIVE_ADDRESS: ${FF_PAYMENTS_USDT_RECEIVE_ADDRESS:-}
      FF_PAYMENTS_USDT_EXPLORER_URL: ${FF_PAYMENTS_USDT_EXPLORER_URL:-}
      FF_PAYMENTS_USDT_EXPLORER_API_KEY: ${FF_PAYMENTS_USDT_EXPLORER_API_KEY:-}
      FF_PAYMENTS_USDT_CONTRACT: ${FF_PAYMENTS_USDT_CONTRACT:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8111/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8111'
  media:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: media
        EXTRAS: ${FF_DOCKER_EXTRAS:-}
    environment:
      PORT: '8112'
      # Files AND the sqlite metadata live on the named volume (the image ships an app-owned, empty media-data dir).
      FF_MEDIA_DATABASE_URL: ${FF_MEDIA_DATABASE_URL:-sqlite+aiosqlite:////app/media-data/media.db}
      FF_MEDIA_DB_AUTO_CREATE: ${FF_MEDIA_DB_AUTO_CREATE:-}
      FF_MEDIA_STORAGE_BACKEND: ${FF_MEDIA_STORAGE_BACKEND:-local}
      FF_MEDIA_STORAGE_ROOT: /app/media-data
      FF_MEDIA_PUBLIC_BASE_URL: ${FF_MEDIA_PUBLIC_BASE_URL:-}
      FF_MEDIA_S3_BUCKET: ${FF_MEDIA_S3_BUCKET:-}
      FF_MEDIA_S3_REGION: ${FF_MEDIA_S3_REGION:-}
      FF_MEDIA_S3_ENDPOINT_URL: ${FF_MEDIA_S3_ENDPOINT_URL:-}
      FF_MEDIA_S3_ACCESS_KEY_ID: ${FF_MEDIA_S3_ACCESS_KEY_ID:-}
      FF_MEDIA_S3_SECRET_ACCESS_KEY: ${FF_MEDIA_S3_SECRET_ACCESS_KEY:-}
      FF_MEDIA_MAX_UPLOAD_BYTES: ${FF_MEDIA_MAX_UPLOAD_BYTES:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    volumes:
    - media-data:/app/media-data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8112/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8112'
  # Optional PostgreSQL (not started by default). Usage:
  #   FF_DOCKER_EXTRAS=pg docker compose --profile pg up --build postgres rfq ...
  #   FF_RFQ_DATABASE_URL=postgresql://ff:${FF_POSTGRES_PASSWORD}@postgres:5432/ff_rfq   (one database per service)
  #   docker compose run --rm rfq alembic upgrade head     (see docs/DB.md)
  postgres:
    profiles:
    - pg
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ff
      POSTGRES_PASSWORD: ${FF_POSTGRES_PASSWORD:-}
      POSTGRES_DB: postgres
    volumes:
    - pgdata:/var/lib/postgresql/data
    expose:
    - '5432'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ff
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  pgdata: {}
  media-data: {}
