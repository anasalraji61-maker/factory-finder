services:
  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: gateway
    ports:
    - 8000:8000
    environment:
      PORT: '8000'
      FF_GATEWAY_UPSTREAMS: '{"sourcing": "http://sourcing:8101", "logistics": "http://logistics:8102", "geo": "http://geo:8103", "trust": "http://trust:8104", "rfq": "http://rfq:8105", "messaging": "http://messaging:8106",
        "tracking": "http://tracking:8107", "notifications": "http://notifications:8108", "assistant": "http://assistant:8109"}'
      FF_GATEWAY_JWT_SECRET: ${FF_GATEWAY_JWT_SECRET:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
      FF_GATEWAY_CORS_ORIGINS: ${FF_GATEWAY_CORS_ORIGINS:-[]}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 3s
      retries: 5
  sourcing:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: sourcing
    environment:
      PORT: '8101'
      FF_SOURCING_TRUST_MODE: http
      FF_SOURCING_TRUST_BASE_URL: http://trust:8104
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8101/health')
      interval: 15s
      timeout: 3s
      retries: 5
    expose:
    - '8101'
  logistics:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: logistics
    environment:
      PORT: '8102'
