      FF_LOGISTICS_FREIGHT_DISABLED: ${FF_LOGISTICS_FREIGHT_DISABLED:-}
      FF_LOGISTICS_FX_PROVIDER: ${FF_LOGISTICS_FX_PROVIDER:-mock}
      FF_LOGISTICS_FREIGHT_PROVIDER: ${FF_LOGISTICS_FREIGHT_PROVIDER:-mock}
      FF_LOGISTICS_FREIGHT_URL: ${FF_LOGISTICS_FREIGHT_URL:-}
      FF_LOGISTICS_FREIGHT_API_KEY: ${FF_LOGISTICS_FREIGHT_API_KEY:-}
