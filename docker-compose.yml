services:
  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: gateway
    ports:
    - 8000:8000
    environment:
      PORT: '8000'
      FF_ENV: ${FF_ENV:-}
      FF_GATEWAY_SERVE_ADMIN: ${FF_GATEWAY_SERVE_ADMIN:-false}
      FF_GATEWAY_REQUIRE_EMAIL_VERIFIED: ${FF_GATEWAY_REQUIRE_EMAIL_VERIFIED:-false}
      FF_GATEWAY_MAIL_BACKEND: ${FF_GATEWAY_MAIL_BACKEND:-off}
      FF_GATEWAY_MAIL_FROM: ${FF_GATEWAY_MAIL_FROM:-no-reply@localhost}
      FF_GATEWAY_SMTP_HOST: ${FF_GATEWAY_SMTP_HOST:-}
      FF_GATEWAY_SMTP_PORT: ${FF_GATEWAY_SMTP_PORT:-587}
      FF_GATEWAY_SMTP_USER: ${FF_GATEWAY_SMTP_USER:-}
      FF_GATEWAY_SMTP_PASSWORD: ${FF_GATEWAY_SMTP_PASSWORD:-}
      FF_GATEWAY_VERIFY_URL_TEMPLATE: ${FF_GATEWAY_VERIFY_URL_TEMPLATE:-}
      FF_PAYMENTS_ADMIN_TOKEN: ${FF_PAYMENTS_ADMIN_TOKEN:-}
      FF_SOURCING_ADMIN_TOKEN: ${FF_SOURCING_ADMIN_TOKEN:-}
      FF_GATEWAY_UPSTREAMS: '{"sourcing": "http://sourcing:8101", "logistics": "http://logistics:8102", "geo": "http://geo:8103", "trust": "http://trust:8104", "rfq": "http://rfq:8105", "messaging": "http://messaging:8106",
        "tracking": "http://tracking:8107", "notifications": "http://notifications:8108", "assistant": "http://assistant:8109", "demand": "http://demand:8110", "payments": "http://payments:8111", "media": "http://media:8112", "feed": "http://feed:8113"}'
      FF_GATEWAY_JWT_SECRET: ${FF_GATEWAY_JWT_SECRET:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
      FF_GATEWAY_CORS_ORIGINS: ${FF_GATEWAY_CORS_ORIGINS:-[]}
      FF_GATEWAY_ADMIN_TOKEN: ${FF_GATEWAY_ADMIN_TOKEN:-}
    depends_on:
      sourcing: {condition: service_healthy}
      logistics: {condition: service_healthy}
      trust: {condition: service_healthy}
      rfq: {condition: service_healthy}
      messaging: {condition: service_healthy}
      tracking: {condition: service_healthy}
      notifications: {condition: service_healthy}
      assistant: {condition: service_healthy}
      demand: {condition: service_healthy}
      payments: {condition: service_healthy}
      media: {condition: service_healthy}
      feed: {condition: service_healthy}
      geo: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
  sourcing:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: sourcing
    environment:
      PORT: '8101'
      FF_ENV: ${FF_ENV:-}
      FF_SOURCING_KILL_SWITCH: ${FF_SOURCING_KILL_SWITCH:-}
      FF_SOURCING_ALIBABA_OPENAPI_DISABLED: ${FF_SOURCING_ALIBABA_OPENAPI_DISABLED:-}
      FF_SOURCING_ENABLED_SOURCES: ${FF_SOURCING_ENABLED_SOURCES:-}
      FF_SOURCING_ADAPTERS: ${FF_SOURCING_ADAPTERS:-}
      FF_SOURCING_ADMIN_TOKEN: ${FF_SOURCING_ADMIN_TOKEN:-}
      FF_SOURCING_ALIBABA_APP_KEY: ${FF_SOURCING_ALIBABA_APP_KEY:-}
      FF_SOURCING_ALIBABA_APP_SECRET: ${FF_SOURCING_ALIBABA_APP_SECRET:-}
      FF_SOURCING_ALIBABA_ACCESS_TOKEN: ${FF_SOURCING_ALIBABA_ACCESS_TOKEN:-}
      FF_SOURCING_LICENSED_MAPPINGS: ${FF_SOURCING_LICENSED_MAPPINGS:-}
      FF_SOURCING_LICENSED_ALLOW_EXAMPLE: ${FF_SOURCING_LICENSED_ALLOW_EXAMPLE:-}
      FF_SOURCING_MIC_API_BASE: ${FF_SOURCING_MIC_API_BASE:-}
      FF_SOURCING_MIC_API_KEY: ${FF_SOURCING_MIC_API_KEY:-}
      FF_SOURCING_TRUST_MODE: http
      FF_SOURCING_TRUST_BASE_URL: http://trust:8104
      FF_SOURCING_DATABASE_URL: ${FF_SOURCING_DATABASE_URL:-}
      FF_SOURCING_DB_AUTO_CREATE: ${FF_SOURCING_DB_AUTO_CREATE:-}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://localhost:8101/health')
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
    - '8101'
  logistics:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
